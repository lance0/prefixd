# Opt-in drop-in for the GoBGP speaker (bgp.backend: gobgp).
#
# Install:
#   sudo mkdir -p /etc/systemd/system/prefixd.service.d
#   sudo install -m 0644 gobgp.conf /etc/systemd/system/prefixd.service.d/gobgp.conf
#   sudo systemctl daemon-reload && sudo systemctl restart prefixd
#
# GoBGP's gRPC endpoint is TCP, so prefixd runs as its own user instead of
# sharing rustbgpd's UID. systemd cannot remove the base unit's
# After=rustbgpd.service; it only orders startup and has no effect when
# rustbgpd is not installed.

[Unit]
After=gobgpd.service

[Service]
User=prefixd
Group=prefixd
