# Drop-in for rustbgpd's shipped rustbgpd.service when prefixd uses its socket.
#
# prefixd accepts /var/lib/rustbgpd/grpc.sock only in a directory of mode 0700.
# systemd resets a StateDirectory= to StateDirectoryMode= (default 0755) on
# every start, so the mode has to be set here rather than with chmod.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/rustbgpd.service.d
#   sudo install -m 0644 prefixd.conf /etc/systemd/system/rustbgpd.service.d/prefixd.conf
#   sudo systemctl daemon-reload && sudo systemctl restart rustbgpd

[Service]
StateDirectoryMode=0700
