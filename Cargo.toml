[package]
name = "prefixd"
version = "0.21.0"
edition = "2024"
rust-version = "1.89"
description = "BGP FlowSpec routing policy daemon for DDoS mitigation"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "sync"] }

# HTTP server
axum = { version = "0.8", features = ["macros", "ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["trace", "cors", "set-header", "limit"] }

# Authentication
axum-login = "0.18"
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }
argon2 = "0.5"
password-hash = "0.5"
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }

# WebSocket
futures-util = "0.3"
rustls = "0.23"

# Encoding
# Cursor encoding uses the scalar engine; SIMD engines are unused.
base64 = { version = "0.23.1", default-features = false, features = ["std"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["serialize", "deserialize"] }

# Database (compile-time checked queries)
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }

# gRPC for GoBGP
tonic = "0.14"
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Metrics
prometheus = "0.14"
once_cell = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
subtle = "2"
serde_json_path = "0.7"
regex = "1"
ipnet = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
reqwest = { version = "0.13", features = ["json"] }
urlencoding = "2"

# OpenAPI
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
rand = "0.10.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"], optional = true }

[build-dependencies]
tonic-build = "0.14"
tonic-prost-build = "0.14"
prost-build = "0.14"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
criterion = { version = "0.8", features = ["async_tokio"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
proptest = "1"

[[bench]]
name = "benchmarks"
harness = false

[features]
default = ["bgp-rustbgpd"]
test-utils = []
# The standard binary contains rustbgpd and GoBGP adapters.
bgp-rustbgpd = ["tonic/tls-aws-lc", "tonic/tls-native-roots", "dep:hyper-util", "dep:rustix"]

[[bin]]
name = "prefixd"
path = "src/main.rs"

[[bin]]
name = "prefixdctl"
path = "src/bin/prefixdctl.rs"
