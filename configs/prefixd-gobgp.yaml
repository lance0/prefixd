pop: iad1
mode: enforced

http:
  listen: "0.0.0.0:8080"
  auth:
    mode: credentials
  # The Compose quickstart serves plain HTTP on port 80. Remove this line once
  # browsers reach prefixd over HTTPS, so session cookies are Secure.
  secure_cookies: false
  # cors_origin: "http://localhost:3000"  # Only needed without a reverse proxy
  rate_limit:
    events_per_second: 100
    burst: 500

bgp:
  backend: gobgp
  gobgp_grpc: "127.0.0.1:50051"
  local_asn: 65010
  router_id: "10.10.0.10"
  neighbors: []

guardrails:
  require_ttl: true
  dst_prefix_minlen: 32
  dst_prefix_maxlen: 32
  # IPv6 prefix length limits (default: 128)
  # dst_prefix_minlen_v6: 128
  # dst_prefix_maxlen_v6: 128
  max_ports: 5
  allow_src_prefix_match: false

quotas:
  max_active_per_customer: 20
  max_active_per_pop: 200
  max_active_global: 500
  max_new_per_minute: 30

timers:
  default_ttl_seconds: 120
  min_ttl_seconds: 30
  max_ttl_seconds: 1800
  reconciliation_interval_seconds: 30

storage:
  # DATABASE_URL env var takes precedence over this value
  # For docker-compose, DATABASE_URL is set automatically
  connection_string: "postgres://user:password@localhost:5432/prefixd"

observability:
  log_format: pretty
  log_level: info

safelist:
  prefixes:
    - "10.0.0.0/8"
    - "192.168.0.0/16"

# Correlation lives in correlation.yaml. When that file exists it replaces any
# correlation block here, so configure it in exactly one place.

shutdown:
  drain_timeout_seconds: 30

