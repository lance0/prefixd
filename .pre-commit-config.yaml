# Optional quick checks, not the full pre-PR gate. Install both Git stages.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt check
        entry: just fmt
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: ruff
        name: ruff check and format check
        entry: just python
        language: system
        files: '\.py$|^ruff\.toml$'
        types: [file]
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-clippy
        name: cargo clippy
        entry: just clippy-all
        language: system
        files: '(^|/)(Cargo\.(toml|lock)|[^/]+\.rs)$|^proto/.*\.proto$|^(\.cargo/.*|rust-toolchain(\.toml)?)$'
        types: [file]
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-test
        name: cargo library and binary tests
        entry: just test-fast
        language: system
        files: '(^|/)(Cargo\.(toml|lock)|[^/]+\.rs)$|^proto/.*\.proto$|^(\.cargo/.*|rust-toolchain(\.toml)?)$'
        types: [file]
        pass_filenames: false
        stages: [pre-push]
