message PeerGroupDefinition {
  optional uint32 hold_time = 1;
  optional uint32 max_prefixes = 2;
  // Optional timed max-prefix restart inherited by group members. When set,
  // must be greater than zero. Omit to retain fail-closed shutdown semantics.
  optional uint32 max_prefix_restart_seconds = 26;
  // Write requests may set md5_password. Read responses redact the value and
  // set has_md5_password instead so clients can preserve or display presence.
  optional string md5_password = 3;
  optional bool ttl_security = 4;
  // Maximum expected distance in hops for RFC 5082 GTSM. Valid range
  // 1..255. Requires ttl_security = true; omission preserves the historical
  // one-hop policy (inbound TTL/Hop-Limit exactly 255).
  optional uint32 ttl_security_hops = 30;
  // Uses the same canonical family labels as NeighborConfig.families.
  repeated string families = 5;
  optional bool graceful_restart = 6;
  optional uint32 gr_restart_time = 7;
  // Local upper bound on the peer-advertised RFC 4724 Restart Time used for
  // disconnected stale-route retention. Unset inherits; valid range 1..4095.
  optional uint32 gr_peer_restart_time_max = 27;
  optional uint64 gr_stale_routes_time = 8;
  optional uint32 llgr_stale_time = 9;
  optional string local_ipv6_nexthop = 10;
  optional bool route_reflector_client = 11;
  optional bool route_server_client = 12;
  optional string remove_private_as = 13;
  optional bool add_path_receive = 14;
  optional bool add_path_send = 15;
  optional uint32 add_path_send_max = 16;
  repeated PolicyStatement import_policy = 17;
  repeated PolicyStatement export_policy = 18;
  repeated string import_policy_chain = 19;
  repeated string export_policy_chain = 20;
  // Read responses set this to expose presence without exposing the secret.
  // For SetPeerGroup, omitted or true with no md5_password preserves the
  // existing value for read/modify/write clients; false with no md5_password
  // explicitly clears it.
  optional bool has_md5_password = 21;
  // RFC 9107 Optimal Route Reflection vantage point inherited by neighbors
  // in this group: an IP address identifying the clients' IGP location as a
  // BGP-LS topology node. Requires route_reflector_client = true.
  optional string orr_vantage = 22;
  // RFC 9687 send hold timer in seconds inherited by neighbors in this
  // group. 0 disables; non-zero must be greater than the effective hold
  // time (RFC 9687 §4.4). Unset = the RFC 9687 §6 default.
  optional uint32 send_hold_time = 23;
  // RFC 7947 §2.3.2 per-client best-path inherited by neighbors in this
  // group. Requires route_server_client. See NeighborConfig.
  optional bool per_client_best = 24;
  // Experimental Paths-Limit receiver preference inherited by neighbors.
  optional uint32 paths_limit_receive_max = 25;
  // Families every inheriting session must negotiate. Empty means no
  // requirement; a non-empty neighbor value overrides this list.
  repeated string required_families = 28;
  // Minimum hold time accepted from group members. Valid range 3..65535.
  optional uint32 min_hold_time = 29;
  // Canonical inbound path-attribute type codes inherited by route-server
  // clients. Full replacement: an empty list clears the group setting.
  repeated uint32 discard_path_attributes = 31;
}

