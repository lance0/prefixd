syntax = "proto3";

package rustbgpd.v1;

option java_multiple_files = true;
option java_package = "com.rustbgpd.v1";

import "google/protobuf/field_mask.proto";

// ---------------------------------------------------------------------------
// Common types
// ---------------------------------------------------------------------------

// Neighbor selectors. Every request field that selects a neighbor by address
// (neighbor_address, peer_address, address, peer, peer_filter,
// source_peer_filter, received_from, advertised_to and the like) takes a bare
// IP literal for a numbered neighbor. An IPv6 link-local (fe80::/10) neighbor
// must be scoped: "fe80::1%eth0", or the bare address plus the request's
// interface field where it has one. A bare link-local selector is
// INVALID_ARGUMENT whatever the configuration; a scope on a numbered address
// is INVALID_ARGUMENT. The scope is part of page-token identity. Response
// peer addresses stay bare IP literals beside a peer_interface field.

enum AddressFamily {
  ADDRESS_FAMILY_UNSPECIFIED = 0;
  ADDRESS_FAMILY_IPV4_UNICAST = 1;
  ADDRESS_FAMILY_IPV6_UNICAST = 2;
  ADDRESS_FAMILY_IPV4_FLOWSPEC = 3;
  ADDRESS_FAMILY_IPV6_FLOWSPEC = 4;
  ADDRESS_FAMILY_L2VPN_EVPN = 5;
  ADDRESS_FAMILY_BGP_LS = 6;
  ADDRESS_FAMILY_BGP_LS_VPN = 7;
  ADDRESS_FAMILY_L3VPN_IPV4_UNICAST = 8;
  ADDRESS_FAMILY_L3VPN_IPV6_UNICAST = 9;
  ADDRESS_FAMILY_IPV4_LABELED_UNICAST = 10;
  ADDRESS_FAMILY_IPV6_LABELED_UNICAST = 11;
  ADDRESS_FAMILY_IPV4_RT_CONSTRAIN = 12;
}

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_IDLE = 1;
  SESSION_STATE_CONNECT = 2;
  SESSION_STATE_ACTIVE = 3;
  SESSION_STATE_OPEN_SENT = 4;
  SESSION_STATE_OPEN_CONFIRM = 5;
  SESSION_STATE_ESTABLISHED = 6;
}

// BFD session state (RFC 5880 section 6.8.1).
enum BfdSessionState {
  BFD_SESSION_STATE_UNSPECIFIED = 0;
  BFD_SESSION_STATE_ADMIN_DOWN = 1;
  BFD_SESSION_STATE_DOWN = 2;
  BFD_SESSION_STATE_INIT = 3;
  BFD_SESSION_STATE_UP = 4;
}

message ErrorDetail {
  oneof kind {
    BgpProtocolError bgp = 1;
    ResourceLimitError resource = 2;
    ConfigError config = 3;
  }
}

message BgpProtocolError {
  uint32 error_code = 1;
  uint32 error_subcode = 2;
  string description = 3;
  string peer_address = 4;
  // Interface of a scoped (IPv6 link-local) neighbor named by peer_address;
  // empty for a numbered one.
  string peer_interface = 5;
}

message ResourceLimitError {
  string limit_name = 1;
  uint64 current_value = 2;
  uint64 max_value = 3;
  string peer_address = 4;
  // Interface of a scoped (IPv6 link-local) neighbor named by peer_address;
  // empty for a numbered one.
  string peer_interface = 5;
}

message ConfigError {
  string field_path = 1;
  string message = 2;
  string provided_value = 3;
}

// ---------------------------------------------------------------------------
// GlobalService — Daemon configuration and identity
// ---------------------------------------------------------------------------

service GlobalService {
  rpc GetGlobal(GetGlobalRequest) returns (GlobalState);
}

message GetGlobalRequest {}

enum TcpAoSupport {
  TCP_AO_SUPPORT_UNSPECIFIED = 0;
  TCP_AO_SUPPORT_SUPPORTED = 1;
  TCP_AO_SUPPORT_UNSUPPORTED = 2;
  TCP_AO_SUPPORT_PROBE_FAILED = 3;
}

message GlobalState {
  uint32 asn = 1;
  string router_id = 2;
  uint32 listen_port = 3;
  // Read-only kernel/runtime capability probe for TCP-AO support (RFC 5925).
  // TCP-AO keyrings are configured through TOML and applied to Linux sockets;
  // this field reports whether the host supports that configuration.
  TcpAoSupport tcp_ao_support = 4;
  // Human-readable probe detail, populated when tcp_ao_support is
  // TCP_AO_SUPPORT_UNSUPPORTED or TCP_AO_SUPPORT_PROBE_FAILED.
  string tcp_ao_detail = 5;
  // Unix epoch seconds of the last successfully accepted full policy
  // generation (initial load, SIGHUP, or config transaction). Zero until
  // the first generation is accepted; rejected loads do not advance it.
  int64 policy_generation_loaded_timestamp_seconds = 6;
}

// ---------------------------------------------------------------------------
// ConfigService — live runtime config diagnostics
// ---------------------------------------------------------------------------

service ConfigService {
  // Compare candidate TOML against the daemon's live runtime config
  // snapshot. The response returns only redacted diff output; it never
  // exports the live config document.
  rpc DiffRuntimeConfig(DiffRuntimeConfigRequest) returns (DiffRuntimeConfigResponse);

  // Validate and classify a candidate config transaction without mutating
  // daemon state. The response includes an optimistic-concurrency token for
  // the current runtime snapshot and a section-level v1 support plan.
  rpc PlanConfigTransaction(PlanConfigTransactionRequest) returns (ConfigTransactionPlanResponse);

  // Stream a large candidate through bounded daemon-private storage, then
  // invoke the same read-only planner as PlanConfigTransaction. This surface
  // is outside the v1 compatibility contract while adoption is evaluated.
  rpc StreamPlanConfigTransaction(stream StreamPlanConfigTransactionRequest) returns (StreamPlanConfigTransactionResponse);

  // Commit a candidate previously accepted by StreamPlanConfigTransaction.
  // The ephemeral plan token binds the exact candidate bytes and runtime
  // snapshot; this surface remains outside the v1 compatibility contract.
  rpc StreamApplyConfigTransaction(stream StreamApplyConfigTransactionRequest) returns (ConfigTransactionApplyResponse);

  // Commit a previously planned candidate transaction. V1 commits one pure
  // runtime family at a time: full-set `[[fib_tables]]`, full-set
  // `[[dynamic_neighbors]]`, static `[[neighbors]]` add/delete/modify, or
  // catalog-only policy/peer-group/global-chain changes that do not alter the
  // effective runtime policy of any static neighbor or dynamic range. Mixed
  // families and sections without an atomic executor are rejected without
  // mutation.
  rpc ApplyConfigTransaction(ApplyConfigTransactionRequest) returns (ConfigTransactionApplyResponse);

  // Confirm a pending confirmed config transaction before its timeout expires.
  rpc ConfirmConfigTransaction(ConfirmConfigTransactionRequest) returns (ConfirmConfigTransactionResponse);

  // Abort a pending confirmed config transaction and roll back immediately.
  rpc AbortConfigTransaction(AbortConfigTransactionRequest) returns (AbortConfigTransactionResponse);

  // Return the current confirmed-transaction lifecycle state. The response is
  // redacted and never includes candidate config contents.
  rpc GetConfigTransactionStatus(GetConfigTransactionStatusRequest) returns (ConfigTransactionStatusResponse);

  // Return the latest process-local SIGHUP result. Empty before the first reload.
  rpc GetLastSighupReload(GetLastSighupReloadRequest) returns (GetLastSighupReloadResponse);

  // Return the daemon's effective running config as normalized TOML with
  // per-neighbor defaults materialized (peer-group inheritance and computed
  // defaults such as hold_time / send_hold_time resolved to the values the
  // daemon is using). Secret material (md5_password, tcp_ao.key) is replaced
  // with the `<redacted>` placeholder before the document leaves the daemon;
  // config validation rejects the placeholder loudly, so a dump taken from a
  // secret-bearing config cannot silently boot as-is.
  rpc GetEffectiveConfig(GetEffectiveConfigRequest) returns (GetEffectiveConfigResponse);

  // List the daemon's bounded v2 config history (newest row first; index 0 may
  // be recorded or unreadable). Retired TOML rows are ignored and retained. The response
  // carries timestamps, verified hashes, provenance status, and one-line
  // summaries only — never config document contents. Every verified row hashes
  // normalized TOML; v2 rows also hash the canonical accepted .rpol/dataset
  // source identity, but do not archive those external bytes.
  rpc ListConfigHistory(ListConfigHistoryRequest) returns (ListConfigHistoryResponse);

  // Read-only, redacted rollback plan for a retained history row. Resolves and
  // verifies the same payload and external-source provenance as rollback, but
  // never applies, persists, or opens a confirmation window. This as-of plan
  // does not reserve the numeric index for a subsequent rollback. Outside v1.
  rpc PreviewConfigRollback(PreviewConfigRollbackRequest) returns (ConfigTransactionPlanResponse);

  // Roll back to a provenance-verified v2 row (index >= 1). The daemon
  // resolves it server-side and routes it through the exact same transaction
  // executor as ApplyConfigTransaction — same plan/impact classification,
  // receipts, and optional confirmed-commit window. Unreadable rows and
  // provenance mismatches fail closed; retired TOML rows are ineligible.
  rpc RollbackConfigTransaction(RollbackConfigTransactionRequest) returns (ConfigTransactionApplyResponse);
}

message ListConfigHistoryRequest {}

message PreviewConfigRollbackRequest {
  // Must be >= 1, like RollbackConfigTransaction. Missing, unreadable and
  // metadata-only rows fail; they never produce an empty successful plan.
  uint32 index = 1;
}

enum ConfigHistoryProvenanceStatus {
  CONFIG_HISTORY_PROVENANCE_STATUS_UNSPECIFIED = 0;
  CONFIG_HISTORY_PROVENANCE_STATUS_RECORDED = 1;
  CONFIG_HISTORY_PROVENANCE_STATUS_LEGACY_TOML_ONLY = 2;
  CONFIG_HISTORY_PROVENANCE_STATUS_UNREADABLE = 3;
  CONFIG_HISTORY_PROVENANCE_STATUS_METADATA_ONLY = 4;
}

message ConfigHistoryEntry {
  // 0 = the newest config-history row, 1 = the next older row, and so on.
  uint32 index = 1;
  // Timestamp metadata from the retained row (unix seconds); an UNREADABLE
  // row's timestamp is parsed from its filename and is not verified.
  uint64 timestamp_unix_seconds = 2;
  // Verified SHA-256 of accepted normalized TOML, hex-encoded; empty for an
  // UNREADABLE row.
  string sha256 = 3;
  // One-line redacted summary (ASN, router id, object counts) — never the
  // config document itself.
  string summary = 4;
  // Config-source SHA-256 over the normalized-TOML digest plus the canonical
  // accepted rpol/dataset source roster. Empty unless that provenance was
  // recorded; always empty for legacy and unreadable entries.
  string source_sha256 = 5;
  ConfigHistoryProvenanceStatus provenance_status = 6;
  // Accepted normalized byte count; zero when unavailable.
  uint64 normalized_toml_bytes = 7;
  // Metadata-only rows retain no rollback payload. Empty for other statuses.
  string metadata_only_reason = 8;
}

message ListConfigHistoryResponse {
  // Newest first; entries[0] is the newest config-history row.
  repeated ConfigHistoryEntry entries = 1;
  string human_text = 2;
}

message RollbackConfigTransactionRequest {
  // Eligible history row to restore; must be >= 1 (index 0 is newest).
  uint32 index = 1;
  // Optional optimistic-concurrency token from PlanConfigTransaction /
  // ListConfigHistory-time planning. Empty skips the stale-snapshot guard —
  // the candidate is resolved server-side from history, not supplied by the
  // caller. Retired TOML rows are ineligible. V2 rows retain source identity
  // and restore only after live inputs reproduce it exactly.
  string expected_runtime_snapshot_token = 2;
  // Optional audit/correlation identifier supplied by automation.
  string client_request_id = 3;
  // Optional human change note. The daemon does not log this field verbatim.
  string comment = 4;
  // Optional confirmed-commit handle, same semantics as
  // ApplyConfigTransactionRequest.confirm_id.
  string confirm_id = 5;
  // Optional confirmed-commit timeout in seconds, same semantics as
  // ApplyConfigTransactionRequest.confirm_timeout_seconds.
  uint32 confirm_timeout_seconds = 6;
}

message GetEffectiveConfigRequest {}

message GetEffectiveConfigResponse {
  // Normalized effective config TOML, defaults materialized, secrets
  // redacted. Key order is canonical (sorted), so the output is stable
  // across calls against an unchanged runtime config.
  string toml = 1;
}

message DiffRuntimeConfigRequest {
  // Complete candidate TOML contents to validate and diff.
  string candidate_toml = 1;
}

message DiffRuntimeConfigResponse {
  bool has_actionable_changes = 1;
  bool has_reload_applied_changes = 2;
  bool has_restart_required_changes = 3;
  bool has_informational_changes = 4;
  bool has_any_changes = 5;
  // Plain-text diff suitable for terminal display. Secret-bearing
  // values follow the same redaction policy as `rustbgpd --diff`.
  string human_text = 6;
  // Pretty-printed JSON object using the same schema as
  // `rustbgpd --diff --json`. The document is unversioned and explicitly
  // unstable: its keys may change between releases. Use the boolean summary
  // fields above for automation.
  string diff_json = 7;
}

message PlanConfigTransactionRequest {
  // Complete candidate TOML contents to validate and classify.
  string candidate_toml = 1;
  // Optional optimistic-concurrency token from a previous plan response.
  // Empty means "plan against whatever runtime snapshot is current now".
  string expected_runtime_snapshot_token = 2;
}

message StreamPlanConfigTransactionRequest {
  oneof frame {
    StreamPlanConfigMetadata metadata = 1;
    bytes candidate_chunk = 2;
    StreamPlanConfigEnd end = 3;
  }
}

message StreamPlanConfigMetadata {
  // Framing version. The only accepted value is 1.
  uint32 version = 1;
  optional string expected_runtime_snapshot_token = 2;
}

message StreamPlanConfigEnd {
  // Exact aggregate byte length of all candidate_chunk frames.
  uint64 candidate_length = 1;
  // Raw 32-byte SHA-256 of the aggregate candidate bytes.
  bytes candidate_sha256 = 2;
}

message StreamPlanConfigTransactionResponse {
  ConfigTransactionPlanResponse plan = 1;
  // Ephemeral process-local binding issued only for a COMMITTABLE plan.
  optional string plan_token = 2;
}

message StreamApplyConfigTransactionRequest {
  oneof frame {
    StreamApplyConfigMetadata metadata = 1;
    bytes candidate_chunk = 2;
    StreamPlanConfigEnd end = 3;
  }
}

message StreamApplyConfigMetadata {
  // Framing version. The only accepted value is 1.
  uint32 version = 1;
  // Ephemeral token returned by StreamPlanConfigTransaction for these exact
  // bytes and expected runtime snapshot.
  string plan_token = 2;
  string expected_runtime_snapshot_token = 3;
  string client_request_id = 4;
  string comment = 5;
  string confirm_id = 6;
  uint32 confirm_timeout_seconds = 7;
}

enum ConfigTransactionPlanStatus {
  CONFIG_TRANSACTION_PLAN_STATUS_UNSPECIFIED = 0;
  CONFIG_TRANSACTION_PLAN_STATUS_NOOP = 1;
  CONFIG_TRANSACTION_PLAN_STATUS_COMMITTABLE = 2;
  CONFIG_TRANSACTION_PLAN_STATUS_REJECTED = 3;
}

message ConfigTransactionPlanResponse {
  ConfigTransactionPlanStatus status = 1;
  // Opaque process-local optimistic-concurrency token for the live runtime
  // config and negotiated update-group snapshot observed while producing this
  // plan. Apply performs the same observation before mutation; the token does
  // not freeze sessions after that apply-time re-plan. It is not a cryptographic
  // commitment or authorization credential; clients must re-plan after daemon
  // restart.
  string runtime_snapshot_token = 2;
  DiffRuntimeConfigResponse diff = 3;
  // Sections v1 knows how to commit atomically once the matching executor PRs
  // are present. Empty when status is NOOP. May be non-empty when REJECTED — a
  // supported section can coexist with an unsupported or restart-required one
  // (or a second supported family), and any such mix rejects the whole
  // single-family transaction.
  repeated string supported_sections = 4;
  // Hot-reloadable sections v1 deliberately refuses to commit yet.
  repeated string unsupported_sections = 5;
  // Sections that still require daemon restart and cannot be committed live.
  repeated string restart_required_sections = 6;
  // Short operator-facing summary of the transaction classification.
  string human_text = 7;
  UpdateGroupImpactPlan update_group_impact = 8;
}

message UpdateGroupImpactPlan {
  uint32 schema_version = 1;
  repeated UpdateGroupFamilyImpact entries = 2;
  UpdateGroupImpactRollup rollup = 3;
  string capacity_class = 4;
  string capacity_basis = 5;
}

message UpdateGroupFamilyImpact {
  string peer = 1;
  // Negotiated address-family identifiers. Both are zero only for the single
  // synthetic indeterminate row emitted when no negotiated family is known.
  uint32 afi = 2;
  uint32 safi = 3;
  string current = 4;
  string candidate = 5;
  string transition = 6;
  string reason = 7;
  string provenance = 8;
  bool local_resync = 9;
  bool remote_route_refresh = 10;
}

message UpdateGroupImpactRollup {
  uint32 affected_peers = 1;
  uint32 affected_families = 2;
  uint32 no_op = 3;
  uint32 regroup = 4;
  uint32 shared_migration = 5;
  uint32 private_resync = 6;
  uint32 indeterminate = 7;
  uint32 projected_shared_groups = 8;
  uint32 projected_private_views = 9;
  uint32 local_resyncs = 10;
  uint32 remote_route_refreshes = 11;
}

message ApplyConfigTransactionRequest {
  // Complete candidate TOML contents to validate and commit.
  string candidate_toml = 1;
  // Required optimistic-concurrency token from PlanConfigTransaction once v1
  // executors are enabled. Empty is rejected by the apply path.
  string expected_runtime_snapshot_token = 2;
  // Optional audit/correlation identifier supplied by automation. It is not an
  // idempotency key; callers must still use the runtime snapshot token.
  string client_request_id = 3;
  // Optional human change note. The daemon does not log this field verbatim
  // because operators may include sensitive context.
  string comment = 4;
  // Optional confirmed-commit handle. When set, the committed candidate enters
  // a pending-confirm state and is automatically rolled back unless
  // ConfirmConfigTransaction is called with the same value before the timeout.
  // This is a correlation handle, not an authorization credential.
  string confirm_id = 5;
  // Optional confirmed-commit timeout in seconds. A zero value uses the daemon
  // default when confirm_id is set and is ignored otherwise.
  uint32 confirm_timeout_seconds = 6;
}

message ConfigTransactionApplyResponse {
  ConfigTransactionPlanStatus status = 1;
  string runtime_snapshot_token = 2;
  repeated string committed_sections = 3;
  string human_text = 4;
  ConfigTransactionConfirmation confirmation = 5;
  UpdateGroupImpactPlan update_group_impact = 6;
}

enum ConfigTransactionConfirmationStatus {
  CONFIG_TRANSACTION_CONFIRMATION_STATUS_UNSPECIFIED = 0;
  CONFIG_TRANSACTION_CONFIRMATION_STATUS_NONE = 1;
  CONFIG_TRANSACTION_CONFIRMATION_STATUS_PENDING = 2;
  CONFIG_TRANSACTION_CONFIRMATION_STATUS_CONFIRMED = 3;
  CONFIG_TRANSACTION_CONFIRMATION_STATUS_ABORTED = 4;
  CONFIG_TRANSACTION_CONFIRMATION_STATUS_AUTO_REVERTED = 5;
  CONFIG_TRANSACTION_CONFIRMATION_STATUS_AUTO_REVERT_FAILED = 6;
  CONFIG_TRANSACTION_CONFIRMATION_STATUS_ABORT_FAILED = 7;
}

message ConfigTransactionConfirmation {
  ConfigTransactionConfirmationStatus status = 1;
  string confirm_id = 2;
  uint32 timeout_seconds = 3;
  uint64 deadline_unix_seconds = 4;
  repeated string committed_sections = 5;
  string runtime_snapshot_token = 6;
  string human_text = 7;
}

message ConfirmConfigTransactionRequest {
  string confirm_id = 1;
}

message ConfirmConfigTransactionResponse {
  ConfigTransactionConfirmation confirmation = 1;
  string human_text = 2;
}

message AbortConfigTransactionRequest {
  string confirm_id = 1;
}

message AbortConfigTransactionResponse {
  ConfigTransactionConfirmation confirmation = 1;
  string runtime_snapshot_token = 2;
  string human_text = 3;
}

message GetConfigTransactionStatusRequest {}

message ConfigTransactionStatusResponse {
  ConfigTransactionConfirmation confirmation = 1;
  string human_text = 2;
}

message GetLastSighupReloadRequest {}

message SighupReloadEffect {
  string bucket = 1;
  string target = 2;
}

message SighupReloadRecord {
  uint64 started_unix_millis = 1;
  uint64 finished_unix_millis = 2;
  // complete, rejected_no_effect, known_partial, task_failed, ignored_in_flight.
  string outcome = 3;
  // generation or sequential; empty if the reload stopped before classification.
  string route = 4;
  string reason_code = 5;
  string failure_bucket = 6;
  string failure_target = 7;
  uint64 applied_count = 8;
  repeated SighupReloadEffect applied = 9;
  uint64 applied_omitted = 10;
  uint64 unapplied_count = 11;
  repeated SighupReloadEffect unapplied = 12;
  uint64 unapplied_omitted = 13;
}

// RIB-side outbound convergence of the export view the latest SIGHUP
// committed, measured when the request is served. It counts every peer with
// a RIB outbound resync pending, whatever marked it dirty: each resync hands
// the transport the current view, so a later generation joins a pending
// resync instead of queueing a second one. It does not confirm receipt:
// transport processing and socket writes may still be pending.
message SighupReloadConvergence {
  // applied: the reload committed its export view, and the RIB has not
  // reported outbound state within the read deadline.
  // converging: pending_peers peers still have a RIB outbound resync pending.
  // converged: no RIB outbound resync is pending.
  string state = 1;
  uint64 pending_peers = 2;
  // Whole seconds since the oldest pending resync began; 0 unless converging.
  uint64 oldest_pending_seconds = 3;
}

message GetLastSighupReloadResponse {
  SighupReloadRecord record = 1;
  // Set only when record.outcome is complete.
  SighupReloadConvergence convergence = 2;
}

// ---------------------------------------------------------------------------
// NeighborService — Peer lifecycle and state
// ---------------------------------------------------------------------------

service NeighborService {
  rpc AddNeighbor(AddNeighborRequest) returns (AddNeighborResponse);
  rpc DeleteNeighbor(DeleteNeighborRequest) returns (DeleteNeighborResponse);
  rpc ListNeighbors(ListNeighborsRequest) returns (ListNeighborsResponse);
  rpc GetNeighborState(GetNeighborStateRequest) returns (NeighborState);
  rpc EnableNeighbor(EnableNeighborRequest) returns (EnableNeighborResponse);
  rpc DisableNeighbor(DisableNeighborRequest) returns (DisableNeighborResponse);
  rpc SoftResetIn(SoftResetInRequest) returns (SoftResetInResponse);
  rpc RefreshOutbound(RefreshOutboundRequest) returns (RefreshOutboundResponse);
  // Schedule one Established peer's negotiated IPv4/IPv6 unicast replay.
  // The reply reports scheduling only; terminal BMP UPDATE EoRs mark completion.
  rpc ReplayOutbound(ReplayOutboundRequest) returns (ReplayOutboundResponse);
  // Administratively reset one enabled neighbor's session: send Cease /
  // Administrative Reset (RFC 4486 subcode 4) carrying the optional RFC 9003
  // shutdown communication and close the TCP connection. Static active-open
  // sessions retry on their normal schedule; accepted dynamic peers are
  // removed on Idle and must reconnect inbound. Enable/disable state is
  // unchanged.
  rpc ResetNeighbor(ResetNeighborRequest) returns (ResetNeighborResponse);
  rpc ListDynamicNeighbors(ListDynamicNeighborsRequest) returns (ListDynamicNeighborsResponse);
  rpc AddDynamicNeighbor(AddDynamicNeighborRequest) returns (AddDynamicNeighborResponse);
  rpc DeleteDynamicNeighbor(DeleteDynamicNeighborRequest) returns (DeleteDynamicNeighborResponse);
  // RFC 8326 graceful-shutdown initiator: toggle attaching the
  // GRACEFUL_SHUTDOWN community (0xFFFF_0000) to outbound updates for
  // one peer, or all peers when address is empty.
  rpc SetGracefulShutdown(SetGracefulShutdownRequest) returns (SetGracefulShutdownResponse);
}

message NeighborConfig {
  string address = 1;
  uint32 remote_asn = 2;
  string description = 3;
  // Hold time in seconds: 0 or 3..65535. Default 90. On AddNeighbor,
  // 0 means unset (inherit the peer-group value, else the default), so a
  // disabled hold timer cannot be requested here. NeighborState reports
  // the effective value, where 0 means disabled.
  uint32 hold_time = 4;
  // Aggregate bound on prefixes accepted from this peer. The effective
  // max_prefix_action (possibly inherited from the peer group) decides what
  // a crossing does. 0 means unset: on AddNeighbor it inherits the
  // peer-group value, and when nothing sets it the bound is unlimited.
  // NeighborState reports the effective value, where 0 means unlimited.
  uint32 max_prefixes = 5;
  // Canonical address-family labels: ipv4_unicast, ipv6_unicast,
  // ipv4_flowspec, ipv6_flowspec, l2vpn_evpn, linkstate, linkstate_vpn,
  // l3vpn_ipv4_unicast, l3vpn_ipv6_unicast, ipv4_labeled_unicast,
  // ipv6_labeled_unicast, or rtc.
  // If empty, defaults to ["ipv4_unicast"].
  repeated string families = 6;
  // Private AS removal mode: "", "remove", "all", or "replace".
  // Empty string means disabled (default).
  string remove_private_as = 7;
  // Optional peer-group reference for inherited transport/policy defaults.
  string peer_group = 8;
  // Whether this eBGP peer is a transparent route-server client.
  bool route_server_client = 9;
  // Enable Add-Path receive capability for this peer.
  bool add_path_receive = 10;
  // Enable Add-Path send capability for this peer.
  bool add_path_send = 11;
  // Maximum paths to advertise per prefix (Add-Path send).
  uint32 add_path_send_max = 12;
  // Optional interface name for IPv6 link-local / unnumbered neighbors.
  string interface = 13;
  // Local BGP Role for RFC 9234 route-leak protection, spelled as in config:
  // provider, route_server, route_server_client, customer, or peer. Empty =
  // disabled. Requests also accept the config aliases rs and rs-client.
  string role = 14;
  // Require the peer to advertise a compatible BGP Role capability.
  bool strict_role = 15;
  // RFC 9687 send hold timer in seconds: tear the session down when the
  // peer stops draining its TCP socket for this long. 0 disables; a
  // non-zero value must be greater than the effective hold time
  // (RFC 9687 §4.4). Unset = the RFC 9687 §6 default,
  // max(480, 2 × hold_time).
  optional uint32 send_hold_time = 16;
  // RFC 7947 §2.3.2 per-client best-path (path-hiding mitigation for
  // route-server clients without Add-Path): when the Loc-RIB best is
  // denied by this peer's export policy, advertise the best permitted
  // candidate instead of hiding the prefix. Requires
  // route_server_client; families with negotiated Add-Path send use
  // Add-Path instead.
  bool per_client_best = 17;
  // Experimental Paths-Limit preference advertised for Add-Path receive families.
  uint32 paths_limit_receive_max = 18;
  // Optional non-zero hold-down before one automatic restart attempt after a
  // max-prefix shutdown. Unset preserves the fail-closed shutdown latch.
  optional uint32 max_prefix_restart_seconds = 19;
  // Families that must be present in the final negotiated intersection.
  // Empty inherits a non-empty peer-group list; when both are empty, legacy
  // partial-intersection behavior is preserved.
  repeated string required_families = 20;
  // Minimum hold time accepted from the peer. Valid range 3..65535.
  // When set, a peer proposal of zero is rejected.
  optional uint32 min_hold_time = 21;
  // Effective canonical inbound path-attribute type codes discarded for this
  // route-server client. Empty means no configured discard.
  repeated uint32 discard_path_attributes = 22;
  // How remote_asn is matched against the ASN in the peer's OPEN.
  // UNSPECIFIED means NUMERIC. With EXTERNAL or INTERNAL, remote_asn is 0 on
  // reads and must be 0 on create requests; the ASN the peer actually sent
  // is NegotiatedSessionState.remote_asn.
  RemoteAsnMode remote_asn_mode = 23;
}

// A neighbor's remote ASN matching mode (TOML remote_asn = a number,
// "external" or "internal").
enum RemoteAsnMode {
  // NUMERIC, the behavior before this field existed.
  REMOTE_ASN_MODE_UNSPECIFIED = 0;
  // remote_asn is the ASN the peer must send.
  REMOTE_ASN_MODE_NUMERIC = 1;
  // Any ASN except the local ASN (eBGP). Never the dynamic-neighbor
  // wildcard: an iBGP OPEN is refused.
  REMOTE_ASN_MODE_EXTERNAL = 2;
  // The local ASN (iBGP).
  REMOTE_ASN_MODE_INTERNAL = 3;
}

// Discovery state of an interface-only neighbor (ADR-0142), which names an
// interface and learns its peer's IPv6 link-local address.
enum NeighborDiscoveryState {
  // Not an interface-only neighbor, or a daemon that does not report it.
  NEIGHBOR_DISCOVERY_STATE_UNSPECIFIED = 0;
  // The interface does not exist yet.
  NEIGHBOR_DISCOVERY_STATE_INTERFACE_MISSING = 1;
  // The interface is down (carrier loss or administratively down).
  NEIGHBOR_DISCOVERY_STATE_LINK_DOWN = 2;
  // The link is up and no peer address is bound yet.
  NEIGHBOR_DISCOVERY_STATE_AWAITING_DISCOVERY = 3;
  // A learned peer address is bound; learned_peer_address names it.
  NEIGHBOR_DISCOVERY_STATE_BOUND = 4;
}

message PathsLimitState {
  string family = 1;
  uint32 configured_receive_max = 2;
  uint32 advertised_receive_max = 3;
  uint32 received_receive_max = 4;
  reserved 5;
  reserved "effective_send_max";
  // Normalized effective send cap. Presence means Add-Path send is active:
  // 0 = unlimited, non-zero = finite. Absence means inactive.
  optional uint32 effective_send_limit = 6;
}

message NeighborState {
  NeighborConfig config = 1;
  SessionState state = 2;
  uint64 uptime_seconds = 3;
  uint64 prefixes_received = 4;
  uint64 prefixes_sent = 5;
  // UPDATE messages received from / sent to this neighbor, End-of-RIB
  // included. Daemon-lifetime per neighbor (address and interface): the
  // count persists across session resets and re-establishment, including on
  // a replacement session, and is cleared only by daemon restart or neighbor
  // deletion. A reconfigure keeps it.
  uint64 updates_received = 6;
  uint64 updates_sent = 7;
  // NOTIFICATION messages received from / sent to this neighbor, all codes:
  // the events bgp_notifications_{received,sent}_total count. Daemon-lifetime
  // per neighbor (address and interface), persisting across session resets
  // and replacement sessions; cleared only by daemon restart or neighbor
  // deletion.
  uint64 notifications_received = 8;
  uint64 notifications_sent = 9;
  // Transitions out of Established (the events bgp_session_flaps_total
  // counts), with the same per-neighbor daemon-lifetime scope.
  uint64 flap_count = 10;
  string last_error = 11;
  // True for peers auto-created from a dynamic_neighbors prefix range.
  bool is_dynamic = 12;
  // True when the per-peer session-state observation is unavailable
  // (e.g. its query timed out). The `state` field is a placeholder Idle,
  // not an observed Idle/down state. Clients must check this flag before
  // treating `state` as authoritative; a stale row remains in the inventory.
  bool stale = 13;
  // Locally configured BGP Role, in the `role` spelling. Empty when disabled.
  string local_role = 14;
  // Remote BGP Role advertised in OPEN. Empty when absent or unknown.
  string remote_role = 15;
  // True when both sides advertised compatible BGP Roles.
  bool role_negotiated = 16;
  // Unicast route announcements blocked by RFC 9234 OTC rules.
  // Daemon-lifetime per neighbor, with the same scope as updates_received.
  uint64 otc_routes_blocked = 17;
  // Import policy evaluations that permitted a route. Daemon-lifetime per
  // neighbor, with the same scope as updates_received.
  uint64 import_policy_routes_permitted = 18;
  // Import policy evaluations that denied a route (same scope).
  uint64 import_policy_routes_denied = 19;
  // Export policy evaluations that permitted a route. Daemon-lifetime per
  // neighbor, with the same scope as updates_received.
  uint64 export_policy_routes_permitted = 20;
  // Export policy evaluations that denied a route (same scope).
  uint64 export_policy_routes_denied = 21;
  // Live outbound update-group membership: "group:N" for shared staging, or
  // the private-path reason
  // ("policy_peer_context", "add_path_send", "per_client_best",
  // "orr_vantage", "orf_installed", "conditional_advertisement", "slow_peer").
  // Empty when the peer has no outbound registration. Diagnostic and
  // explicitly unstable: N is a process-local identifier and the reason set
  // may change. Compare membership with update_group_comparison instead.
  string update_group = 22;
  // Total BGP messages received/sent, all types (OPEN, KEEPALIVE,
  // UPDATE, NOTIFICATION, ROUTE-REFRESH). Mirrors the
  // bgp_messages_{received,sent}_total telemetry counters: values are
  // daemon-lifetime and persist across session flaps, matching the
  // classic "show ip bgp summary" MsgRcvd/MsgSent semantics (cleared
  // only by daemon restart).
  uint64 messages_received = 23;
  uint64 messages_sent = 24;
  // True when this iBGP peer is configured as a route-reflector
  // client. Read-only state: RR-client is configured via TOML or
  // peer-group, not on the runtime neighbor-add gRPC surface.
  bool route_reflector_client = 25;
  // Experimental Paths-Limit values, one row per relevant family.
  repeated PathsLimitState paths_limits = 26;
  // Effective transport authentication for this session. Direct dynamic-prefix
  // TCP-AO sessions derive this identity from the validated accepted socket.
  AuthenticationMode authentication = 27;
  // Best-effort query-time Linux TCP-AO inspection; absent when not AO or when
  // no live snapshot is available (including disconnect or inspection failure).
  // The TCP-AO fields (tcp_ao, tcp_ao_health, and tcp_ao_desired_generation
  // through tcp_ao_rotation_error) follow the alpha TCP-AO lifecycle and are
  // explicitly unstable.
  TcpAoState tcp_ao = 28;
  // Health derived from the effective protection identity and query-time
  // inspection. UNAVAILABLE means TCP-AO protection is expected but no socket
  // snapshot is available (disconnected, still connecting, or inspection
  // failed).
  TcpAoHealth tcp_ao_health = 29;
  // Effective live unicast distribution mode reported by the RIB. This is
  // UNKNOWN while the peer has no active outbound registration.
  EffectiveDistributionMode effective_distribution_mode = 30;
  // Process-start RFC 4724 selection-deferral state. Empty on cold starts.
  repeated SelectionDeferralFamilyState selection_deferral = 31;
  // Immutable TCP-AO inventory generation requested by the reload
  // coordinator and the generation fully applied to this peer session.
  uint64 tcp_ao_desired_generation = 32;
  uint64 tcp_ao_applied_generation = 33;
  // Current values: idle, add_only, add_only_failed, selecting,
  // awaiting_peer, selection_failed, deleting, delete_failed.
  string tcp_ao_rotation_phase = 34;
  // Secret-free actionable rotation failure. Empty when the phase is healthy.
  string tcp_ao_rotation_error = 35;
  // Slow-peer flag: the session is alive but its outbound queue has
  // stayed above the configured backlog threshold for the configured
  // duration (slow_peer_threshold_pct / slow_peer_duration). Clears
  // when the queue drains and on session teardown.
  bool slow_peer = 36;
  // Local operator intent to attach RFC 8326 GRACEFUL_SHUTDOWN to
  // announcements sent to this peer. Presence distinguishes an older daemon
  // that does not expose this state from an explicit disabled value.
  optional bool graceful_shutdown_advertise_intent = 37;
  // Effective current max-prefix disposition: "shutdown", "restart", "block",
  // or "warning".
  string max_prefix_action = 38;
  // Present only while a timed max-prefix restart hold-down is active.
  optional uint64 max_prefix_restart_remaining_millis = 39;
  UpdateGroupComparison update_group_comparison = 40;
  // Authoritative O(1) unique-prefix accounting from the session actor.
  // prefixes_received remains the aggregate across every counted family;
  // these two fields are the IPv4/IPv6 unicast subsets. Max-prefix limits
  // and headroom are reported per scope in inbound_prefix_limits.
  uint64 prefixes_received_ipv4 = 41;
  uint64 prefixes_received_ipv6 = 42;
  reserved 43 to 48;
  reserved "effective_max_prefixes", "effective_max_prefixes_ipv4",
      "effective_max_prefixes_ipv6", "max_prefix_headroom",
      "max_prefix_headroom_ipv4", "max_prefix_headroom_ipv6";
  // Presence distinguishes an older daemon that does not expose negotiation
  // state from a current daemon reporting no Established session.
  optional bool negotiation_available = 49;
  // Actor-authoritative values from the current Established session. Absent
  // while down, during OpenConfirm, or when the actor query is stale.
  NegotiatedSessionState negotiated_session = 50;
  // ADR-0112 RFC 8212 explicit-policy status, one value per direction. A
  // one-sided configuration is never collapsed into a single "policy
  // present" answer. MISSING means the reserved internal deny is installed
  // on that direction of this peer and no route crosses it, in any
  // negotiated family.
  Rfc8212PolicyStatus rfc8212_import_policy = 51;
  Rfc8212PolicyStatus rfc8212_export_policy = 52;
  // ADR-0113 outbound unicast capacity, one row per limited family. Empty
  // from a daemon that does not expose it and from a peer with no outbound
  // registration; a registered peer always reports both unicast families.
  repeated OutboundPrefixLimitState outbound_prefix_limits = 53;
  // Resolved running posture inherited by this peer. Message presence
  // distinguishes an older daemon from a current daemon whose boolean values
  // are explicitly false.
  EffectiveNeighborPosture effective_posture = 54;
  // Canonical range and peer group captured when this dynamic peer was
  // accepted. Absent for static peers and when reading an older daemon.
  AcceptedDynamicNeighborRange accepted_dynamic_range = 55;
  // Actor-authoritative size of this session's bounded retained-reject store.
  // Absence means an older daemon or a stale peer-session snapshot; clients
  // must not interpret absence as zero.
  optional uint64 rejected_routes_retained = 56;
  // Seconds until the next automatic reconnect attempt while the session
  // waits in Idle after an unplanned teardown. Consecutive NOTIFICATION
  // failures lengthen this wait; 0 when no reconnect is pending. Absence
  // means the daemon predates this field.
  optional uint64 reconnect_in_seconds = 57;
  // ADR-0108 amendment: one row per finite inbound max-prefix bound, in
  // enforcement order. Empty from an older daemon, a stale peer-session
  // snapshot, or a peer with no finite bound.
  repeated InboundPrefixLimitState inbound_prefix_limits = 58;
  // RFC 4724 / RFC 9494 helper-side stale-route retention, one row per family
  // the RIB tracks in a GR or LLGR phase. Present while the session is down;
  // empty when nothing is retained.
  repeated GracefulRestartRetentionState gr_retention = 59;
  // Presence distinguishes an older daemon that does not expose retention
  // from a current daemon whose empty gr_retention means nothing is retained.
  optional bool gr_retention_available = 60;
  // Present and true on a row synthesized for an address that has no
  // neighbor-inventory entry but whose GR/LLGR stale routes the RIB still
  // retains, such as a dynamic neighbor whose session went idle. Such a row
  // carries config.address, config.remote_asn (the ASN the RIB last
  // recorded, 0 if unknown), state IDLE, and the RIB-owned fields including
  // gr_retention; every other configuration and session field is its
  // default. The row disappears when retention ends. Absent on ordinary rows
  // and from older daemons.
  optional bool retention_only = 61;
  // True while this peer missed outbound delivery and waits for the RIB's
  // full export resync (retried every second). Absence means an older daemon.
  optional bool outbound_resync_pending = 62;
  // Whole seconds the current outbound resync has been pending. Present only
  // while outbound_resync_pending is true.
  optional uint64 outbound_dirty_seconds = 63;
  // Update-group recovery fallback cause recorded for the current session:
  // "peer_limit", "daemon_limit", "allocation_failure", or "missing_proof",
  // the cause label of bgp_update_group_recovery_fallback_total. While set,
  // the member's resync withdraws every candidate prefix it might have
  // advertised instead of only the ones it is known to have advertised.
  // Empty when no fallback is recorded. Update-group internal; explicitly
  // unstable.
  string update_group_recovery_fallback = 64;
  // True while prefixes_sent is the update group's desired count for a
  // member whose delivery is unconfirmed (a grouped member awaiting resync),
  // not the routes the peer is known to hold. Absence means an older daemon.
  // Update-group internal; explicitly unstable.
  optional bool prefixes_sent_pending = 65;
  // Interface-only neighbor (config.address empty, config.interface set):
  // the IPv6 link-local address bound to it, without a scope. Empty until
  // an address is bound, and for every other neighbor.
  string learned_peer_address = 66;
  // Interface-only neighbor discovery state; UNSPECIFIED for every other
  // neighbor.
  NeighborDiscoveryState discovery_state = 67;
  // The session reports nothing to BMP: another BMP-monitored neighbor held
  // its link-local address when it was admitted, and every collector sets
  // on_identity_conflict = "exclude". Kept for the life of the session.
  bool bmp_identity_excluded = 68;
}

// Stale routes one family of a neighbor still holds for GR or LLGR.
message GracefulRestartRetentionState {
  // Family label, for example "ipv4_unicast".
  string family = 1;
  // "gr_restart" (session down, restart timer running), "gr_awaiting_eor"
  // (session re-established, waiting for End-of-RIB), or "llgr" (RFC 9494
  // long-lived stale phase).
  string phase = 2;
  // Whole seconds, rounded up, until the RIB's next retention deadline for
  // this family: GR timer expiry (sweep, or promotion to LLGR when
  // negotiated) or the LLGR sweep, whichever comes first. Absent when no
  // deadline is armed.
  optional uint64 remaining_seconds = 3;
  // Routes of this family still held GR- or LLGR-stale, from counters the
  // RIB maintains as routes are marked, re-advertised, withdrawn and swept.
  // Reported by both ListNeighbors and GetNeighborState; absent from older
  // daemons, and from ListNeighbors on daemons that counted only for a
  // single neighbor. Zero while End-of-RIB is still awaited after every
  // stale route was re-advertised.
  optional uint64 stale_routes = 4;
}

message AcceptedDynamicNeighborRange {
  string prefix = 1;
  string peer_group = 2;
}

// Read-only resolved posture copied from the peer's running transport config.
// This is not a second configuration surface.
message EffectiveNeighborPosture {
  NextHopOwnershipMode next_hop_ownership = 1;
  // Effective RFC 1997 NO_EXPORT / NO_EXPORT_SUBCONFED egress interpretation.
  bool interpret_rfc1997 = 2;
  // Effective RFC 7947 / RFC 8195 route-server control-community handling.
  bool rs_control_communities = 3;
  // Effective RFC 9107 vantage inherited by an ORR client.
  optional string orr_vantage = 4;
}

// Effective ADR-0107 route-server NEXT_HOP ownership enforcement. Rolling
// compatible: an older daemon omits the containing posture message; clients
// also treat UNSPECIFIED and unrecognized future values as unknown.
enum NextHopOwnershipMode {
  NEXT_HOP_OWNERSHIP_MODE_UNSPECIFIED = 0;
  NEXT_HOP_OWNERSHIP_MODE_DISABLED = 1;
  NEXT_HOP_OWNERSHIP_MODE_STRICT_PEER = 2;
}

// RFC 8212 explicit-policy status for one direction of one session
// (ADR-0112). Rolling-compatible: a daemon that predates the field leaves it
// at UNSPECIFIED, and clients must render UNSPECIFIED and any unrecognized
// future value as "unknown" rather than assuming NOT_REQUIRED.
enum Rfc8212PolicyStatus {
  // Field absent or defaulted across a version boundary.
  RFC8212_POLICY_STATUS_UNSPECIFIED = 0;
  // The current daemon or client cannot determine the verdict.
  RFC8212_POLICY_STATUS_UNKNOWN = 1;
  // Enforcement is disabled process-wide, or this session is iBGP.
  RFC8212_POLICY_STATUS_NOT_REQUIRED = 2;
  // Enforcement applies and explicit operator policy is installed.
  RFC8212_POLICY_STATUS_PRESENT = 3;
  // Enforcement applies and the reserved internal deny is installed.
  RFC8212_POLICY_STATUS_MISSING = 4;
}

// One unicast family's outbound prefix capacity for a neighbor (ADR-0113).
message OutboundPrefixLimitState {
  // "ipv4_unicast" or "ipv6_unicast".
  string family = 1;
  // Distinct prefixes currently admitted into this peer's advertised state,
  // post-policy, post-OTC, and post-exact-export. Agrees with advertised-route
  // queries; never the shared update-group table's count.
  uint64 usage = 2;
  // Configured maximum. Absence means unlimited, never zero.
  optional uint32 limit = 3;
  // Saturating limit - usage. Absent while the family is unlimited.
  optional uint32 headroom = 4;
  // Whether a blocking episode is currently open for this family.
  bool blocking = 5;
  // Stable reason while blocking: "outbound_prefix_limit_reached". Absent
  // otherwise.
  optional string reason = 6;
}

// One finite inbound max-prefix bound's live capacity for a neighbor
// (ADR-0108 amendment).
message InboundPrefixLimitState {
  // The joined scope string ("ipv4_unicast_received") was replaced by
  // family + stage, the labels of the bgp_max_prefix_* metrics.
  reserved 1;
  reserved "scope";
  // "aggregate" for the neighbor-wide max_prefixes, or the bound's canonical
  // family label: "ipv4_unicast", "ipv6_unicast", "l3vpn_ipv4_unicast",
  // "l3vpn_ipv6_unicast", "ipv4_labeled_unicast", "ipv6_labeled_unicast",
  // "l2vpn_evpn", "ipv4_flowspec", "ipv6_flowspec" or "rtc".
  string family = 7;
  // "accepted" (counted after import policy) or "received" (counted before
  // it, the max_prefixes_received_* bounds); only the unicast families have a
  // "received" row.
  string stage = 8;
  // The session actor's enforcement count for the bound.
  uint64 usage = 2;
  // Configured bound.
  uint32 limit = 3;
  // Saturating limit - usage.
  uint32 headroom = 4;
  // Whether a `block` episode is open: net-new prefixes are being withheld
  // until usage falls back under the bound.
  bool blocking = 5;
  // Stable reason while blocking: "inbound_prefix_limit_reached". Absent
  // otherwise.
  optional string reason = 6;
}

message NegotiatedSessionState {
  // Scalars are optional so false/zero negotiated values remain distinct from
  // fields not exposed by an older daemon during a rolling upgrade.
  optional uint32 hold_time_seconds = 1;
  optional string remote_router_id = 2;
  optional bool four_octet_as = 3;
  repeated string families = 4;
  // Present only when the peer advertised usable GR coverage for at least one
  // mutually negotiated family supported by the local helper.
  NegotiatedGracefulRestartState graceful_restart = 5;
  optional bool peer_route_refresh = 6;
  optional bool peer_enhanced_route_refresh = 7;
  optional bool peer_extended_message = 8;
  // Directional send-side limit: the peer's Extended Messages capability
  // governs whether rustbgpd may send 4096 or 65535-byte BGP messages.
  optional uint32 outbound_max_message_bytes = 9;
  // Cached local IP address for the current Established connection.
  optional string local_address = 10;
  // Negotiated KEEPALIVE cadence, including present zero when Hold Time is 0.
  optional uint32 keepalive_interval_seconds = 11;
  // The ASN the peer sent in its OPEN (the four-octet AS capability when
  // present). For a neighbor configured with REMOTE_ASN_MODE_EXTERNAL this is
  // the only place the session's actual ASN appears.
  optional uint32 remote_asn = 12;
}

message NegotiatedGracefulRestartState {
  repeated string peer_families = 1;
  // Peer-advertised Restart Time. Presence preserves a negotiated zero.
  optional uint32 peer_restart_time_seconds = 2;
  // Initial disconnected retention after the live local cap. Absent when the
  // local GR helper is disabled.
  optional uint32 effective_retention_time_seconds = 3;
}

message UpdateGroupComparison {
  UpdateGroupComparisonVerdict verdict = 1;
  UpdateGroupComparisonMembership primary_membership = 2;
  UpdateGroupComparisonMembership comparison_membership = 3;
  repeated UpdateGroupComparisonDifference differences = 4;
}

enum UpdateGroupComparisonVerdict {
  UPDATE_GROUP_COMPARISON_VERDICT_UNSPECIFIED = 0;
  UPDATE_GROUP_COMPARISON_VERDICT_UNKNOWN = 1;
  UPDATE_GROUP_COMPARISON_VERDICT_PRIVATE = 2;
  UPDATE_GROUP_COMPARISON_VERDICT_SHARED = 3;
  UPDATE_GROUP_COMPARISON_VERDICT_SEPARATE = 4;
}

enum UpdateGroupComparisonMembership {
  UPDATE_GROUP_COMPARISON_MEMBERSHIP_UNSPECIFIED = 0;
  UPDATE_GROUP_COMPARISON_MEMBERSHIP_UNKNOWN = 1;
  UPDATE_GROUP_COMPARISON_MEMBERSHIP_GROUPED = 2;
  UPDATE_GROUP_COMPARISON_MEMBERSHIP_POLICY_PEER_CONTEXT = 3;
  UPDATE_GROUP_COMPARISON_MEMBERSHIP_ADD_PATH_SEND = 4;
  UPDATE_GROUP_COMPARISON_MEMBERSHIP_PER_CLIENT_BEST = 5;
  UPDATE_GROUP_COMPARISON_MEMBERSHIP_ORR_VANTAGE = 6;
  UPDATE_GROUP_COMPARISON_MEMBERSHIP_ORF_INSTALLED = 7;
  UPDATE_GROUP_COMPARISON_MEMBERSHIP_SLOW_PEER = 8;
  UPDATE_GROUP_COMPARISON_MEMBERSHIP_CONDITIONAL_ADVERTISEMENT = 9;
}

enum UpdateGroupComparisonDifference {
  UPDATE_GROUP_COMPARISON_DIFFERENCE_UNSPECIFIED = 0;
  UPDATE_GROUP_COMPARISON_DIFFERENCE_EXPORT_POLICY = 1;
  UPDATE_GROUP_COMPARISON_DIFFERENCE_SESSION_KIND = 2;
  UPDATE_GROUP_COMPARISON_DIFFERENCE_ROUTE_REFLECTOR_CLIENT = 3;
  UPDATE_GROUP_COMPARISON_DIFFERENCE_LOCAL_ROLE = 4;
  UPDATE_GROUP_COMPARISON_DIFFERENCE_RFC1997_MODE = 5;
  UPDATE_GROUP_COMPARISON_DIFFERENCE_NEGOTIATED_FAMILIES = 6;
  UPDATE_GROUP_COMPARISON_DIFFERENCE_LLGR_FAMILIES = 7;
  UPDATE_GROUP_COMPARISON_DIFFERENCE_PER_CLIENT_BEST = 8;
}

message SelectionDeferralFamilyState {
  uint32 afi = 1;
  uint32 safi = 2;
  bool active = 3;
  string waiter_state = 4;
  // Process-local session stamp; explicitly unstable.
  optional uint64 waiter_session_id = 5;
  uint64 blocking_waiters = 6;
  uint64 remaining_millis = 7;
  // Empty while active; "all_eor" or "timer" after release.
  string release_reason = 8;
  // Canonical family label for afi/safi, for example "ipv4_unicast", using
  // the configuration spelling. Empty from an older daemon.
  string family = 9;
}

enum EffectiveDistributionMode {
  EFFECTIVE_DISTRIBUTION_MODE_UNSPECIFIED = 0;
  EFFECTIVE_DISTRIBUTION_MODE_UNKNOWN = 1;
  EFFECTIVE_DISTRIBUTION_MODE_SINGLE_BEST = 2;
  EFFECTIVE_DISTRIBUTION_MODE_ADD_PATH = 3;
  EFFECTIVE_DISTRIBUTION_MODE_ORR = 4;
  EFFECTIVE_DISTRIBUTION_MODE_PER_CLIENT_BEST = 5;
}

enum AuthenticationMode {
  AUTHENTICATION_MODE_UNSPECIFIED = 0;
  AUTHENTICATION_MODE_PLAINTEXT = 1;
  AUTHENTICATION_MODE_MD5 = 2;
  AUTHENTICATION_MODE_TCP_AO = 3;
}

enum TcpAoHealth {
  TCP_AO_HEALTH_UNSPECIFIED = 0;
  TCP_AO_HEALTH_NOT_APPLICABLE = 1;
  TCP_AO_HEALTH_UNAVAILABLE = 2;
  TCP_AO_HEALTH_HEALTHY = 3;
  TCP_AO_HEALTH_DEGRADED = 4;
}

message TcpAoState {
  optional uint32 current_key_id = 1;
  optional uint32 rnext_key_id = 2;
  bool ao_required = 3;
  bool accept_icmps = 4;
  uint64 packets_good = 5;
  uint64 packets_bad = 6;
  uint64 packets_key_not_found = 7;
  uint64 packets_ao_required = 8;
  uint64 packets_dropped_icmp = 9;
  // Redacted kernel MKT inventory. Never contains key material, key length,
  // hashes, fingerprints, or other key-derived identifiers.
  repeated TcpAoKeyState keys = 10;
}

message TcpAoKeyState {
  string peer_address = 1;
  uint32 prefix_length = 2;
  uint32 send_id = 3;
  uint32 recv_id = 4;
  string algorithm = 5;
  bool is_current = 6;
  bool is_rnext = 7;
  bool preferred = 8;
  bool deprecated = 9;
  uint64 packets_good = 10;
  uint64 packets_bad = 11;
  // Linux VRF L3-master ifindex (`TCP_AO_KEYF_IFINDEX`), when present.
  // This is not an IPv6 link-local scope ID.
  optional uint32 vrf_ifindex = 12;
  // Interface of the neighbor whose socket holds this key, when
  // peer_address is IPv6 link-local; empty otherwise. peer_address stays a
  // bare IP literal.
  string peer_interface = 13;
}

message DynamicNeighborRange {
  // IP prefix range (e.g., "10.0.0.0/24").
  string prefix = 1;
  // Peer group whose config dynamic peers inherit.
  string peer_group = 2;
  // Expected remote ASN. 0 = accept any ASN from OPEN.
  uint32 remote_asn = 3;
  // Description applied to dynamic peers from this range.
  string description = 4;
}

message ListDynamicNeighborsRequest {}

message ListDynamicNeighborsResponse {
  repeated DynamicNeighborRange ranges = 1;
}

message AddDynamicNeighborRequest {
  DynamicNeighborRange range = 1;
}

message AddDynamicNeighborResponse {}

message DeleteDynamicNeighborRequest {
  string prefix = 1;
}

message DeleteDynamicNeighborResponse {}

message AddNeighborRequest {
  reserved 1;
  reserved "config";
  // Presence-aware create payload. Required by v0.65 and newer servers.
  NeighborCreateIntent intent = 2;
}

message NeighborCreateIntent {
  NeighborConfig config = 1;
  google.protobuf.FieldMask override_mask = 2;
}

message AddNeighborResponse {}

message DeleteNeighborRequest {
  string address = 1;
  string interface = 2;
}

message DeleteNeighborResponse {}

message ListNeighborsRequest {}

message ListNeighborsResponse {
  // Ordered numerically by IP (IPv4 before IPv6), then lexicographically by
  // interface (absent before present). Interface-only neighbors with no bound
  // address follow, ordered by interface.
  repeated NeighborState neighbors = 1;
}

message GetNeighborStateRequest {
  string address = 1;
