rule_files:
  - prometheus-alerts.yml
evaluation_interval: 15s
tests:
  # Blackholes active, then prefixd goes down: all three relevant alerts fire.
  - interval: 1m
    input_series:
      - series: 'up{job="prefixd",instance="a"}'
        values: '1x10 0x20'
      - series: 'prefixd_controller_fence_active{job="prefixd",instance="a"}'
        values: '1x10 stale'
      - series: 'prefixd_mitigations_active{job="prefixd",instance="a",action_type="blackhole",pop="p"}'
        values: '2x10 stale'
    alert_rule_test:
      - eval_time: 20m
        alertname: PrefixdDown
        exp_alerts:
          - exp_labels: {severity: critical, job: prefixd, instance: a}
            exp_annotations:
              summary: "prefixd is down"
              description: "a has failed scrapes for 2 minutes. TTL expiry and withdrawals stop while it is down. Leased routes may lapse; unleased routes can remain on the speaker."
      - eval_time: 20m
        alertname: PrefixdBlackholesWhileDegraded
        exp_alerts:
          - exp_labels: {severity: critical, job: prefixd}
            exp_annotations:
              summary: "Blackholes may outlive an inactive prefixd"
              description: "prefixd had active blackholes when its last active controller stopped. Unleased blackholes can stay announced until prefixd returns or an operator withdraws them; leased blackholes may lapse. Restart prefixd: it expires overdue blackholes, and startup reconciliation removes routes left by terminal rows. If you withdraw by hand on the speaker, also withdraw in prefixd once it returns, or reconciliation re-announces blackholes whose TTL has not passed."
      - eval_time: 20m
        alertname: PrefixdNotReady
        exp_alerts: []
  # Blackholes ended before prefixd went down: only PrefixdDown fires.
  - interval: 1m
    input_series:
      - series: 'up{job="prefixd",instance="a"}'
        values: '1x10 0x20'
      - series: 'prefixd_controller_fence_active{job="prefixd",instance="a"}'
        values: '1x10 stale'
      - series: 'prefixd_mitigations_active{job="prefixd",instance="a",action_type="blackhole",pop="p"}'
        values: '2x4 stale'
    alert_rule_test:
      - eval_time: 20m
        alertname: PrefixdBlackholesWhileDegraded
        exp_alerts: []
  # Up but in standby with blackholes: not ready and degraded.
  - interval: 1m
    input_series:
      - series: 'up{job="prefixd",instance="a"}'
        values: '1x30'
      - series: 'prefixd_controller_fence_active{job="prefixd",instance="a"}'
        values: '1x10 0x20'
      - series: 'prefixd_mitigations_active{job="prefixd",instance="a",action_type="blackhole",pop="p"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: PrefixdNotReady
        exp_alerts:
          - exp_labels: {severity: critical, job: prefixd}
            exp_annotations:
              summary: "No active prefixd controller"
              description: "Every scraped prefixd process is in standby: none holds the fence, so nothing expires, withdraws or reconciles."
      - eval_time: 20m
        alertname: PrefixdBlackholesWhileDegraded
        exp_alerts:
          - exp_labels: {severity: critical, job: prefixd}
            exp_annotations:
              summary: "Blackholes may outlive an inactive prefixd"
              description: "prefixd had active blackholes when its last active controller stopped. Unleased blackholes can stay announced until prefixd returns or an operator withdraws them; leased blackholes may lapse. Restart prefixd: it expires overdue blackholes, and startup reconciliation removes routes left by terminal rows. If you withdraw by hand on the speaker, also withdraw in prefixd once it returns, or reconciliation re-announces blackholes whose TTL has not passed."
      - eval_time: 20m
        alertname: PrefixdDown
        exp_alerts: []
  # prefixd goes down while the blackhole gauge reads 0: only PrefixdDown fires.
  - interval: 1m
    input_series:
      - series: 'up{job="prefixd",instance="a"}'
        values: '1x10 0x20'
      - series: 'prefixd_controller_fence_active{job="prefixd",instance="a"}'
        values: '1x10 stale'
      - series: 'prefixd_mitigations_active{job="prefixd",instance="a",action_type="blackhole",pop="p"}'
        values: '0x10 stale'
    alert_rule_test:
      - eval_time: 20m
        alertname: PrefixdBlackholesWhileDegraded
        exp_alerts: []
  # Up and active with blackholes: nothing fires.
  - interval: 1m
    input_series:
      - series: 'up{job="prefixd",instance="a"}'
        values: '1x30'
      - series: 'prefixd_controller_fence_active{job="prefixd",instance="a"}'
        values: '1x30'
      - series: 'prefixd_mitigations_active{job="prefixd",instance="a",action_type="blackhole",pop="p"}'
        values: '2x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: PrefixdBlackholesWhileDegraded
        exp_alerts: []
      - eval_time: 20m
        alertname: PrefixdDown
        exp_alerts: []
  # Blackholes exported to no peer for 5 minutes fire per reason; a brief
  # pending export or selection hold does not, and a hold that outlasts the
  # window does.
  - interval: 1m
    input_series:
      - series: 'prefixd_blackhole_unexported{job="prefixd",instance="a",reason="export_policy"}'
        values: '0x2 1x10'
      - series: 'prefixd_blackhole_unexported{job="prefixd",instance="a",reason="no_established_peer"}'
        values: '0x2 2x10'
      - series: 'prefixd_blackhole_unexported{job="prefixd",instance="a",reason="pending"}'
        values: '0x2 1x2 0x8'
      - series: 'prefixd_blackhole_unexported{job="prefixd",instance="a",reason="selection_deferred"}'
        values: '0x2 1x2 0x8'
      - series: 'prefixd_blackhole_unexported{job="prefixd",instance="b",reason="selection_deferred"}'
        values: '0x2 1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: PrefixdBlackholeNotExported
        exp_alerts: []
      - eval_time: 10m
        alertname: PrefixdBlackholeNotExported
        exp_alerts:
          - exp_labels: {severity: warning, job: prefixd, instance: a, reason: export_policy}
            exp_annotations:
              summary: "Active blackhole exported to no peer"
              description: "1 active blackhole(s) on a are committed to no Established peer, reason export_policy, so no router is sent them. Export policy denies them toward every Established peer; check the speaker's export policy. Health detail lists each blackhole under speaker.blackhole_exports."
          - exp_labels: {severity: warning, job: prefixd, instance: a, reason: no_established_peer}
            exp_annotations:
              summary: "Active blackhole exported to no peer"
              description: "2 active blackhole(s) on a are committed to no Established peer, reason no_established_peer, so no router is sent them. Health detail lists each blackhole under speaker.blackhole_exports."
          - exp_labels: {severity: warning, job: prefixd, instance: b, reason: selection_deferred}
            exp_annotations:
              summary: "Active blackhole exported to no peer"
              description: "1 active blackhole(s) on b are committed to no Established peer, reason selection_deferred, so no router is sent them. The speaker holds them from selection after a restart, which rustbgpd v0.81.0 and later do not do for prefixd's blackholes; check the speaker version. Health detail lists each blackhole under speaker.blackhole_exports."

  # Startup exports the series at zero, so the first replacement fires. Only
  # the affected POP fires, and the alert clears once the last increase
  # leaves the one-hour window.
  - interval: 1m
    input_series:
      - series: 'prefixd_blackhole_replaced_total{job="prefixd",instance="a",pop="pop-a"}'
        values: '0x5 1x80'
      - series: 'prefixd_blackhole_replaced_total{job="prefixd",instance="b",pop="pop-b"}'
        values: '0x85'
    alert_rule_test:
      - eval_time: 5m
        alertname: PrefixdBlackholeReplaced
        exp_alerts: []
      - eval_time: 6m
        alertname: PrefixdBlackholeReplaced
        exp_alerts:
          - exp_labels: {severity: critical, job: prefixd, instance: a, pop: pop-a}
            exp_annotations:
              summary: "Unleased blackhole replaced an untracked local route"
              description: "prefixd on a at POP pop-a reported an unleased blackhole add that replaced an untracked local route in the last hour. This is historical replacement evidence, not proof of an active conflict or router enforcement. Inspect the error log and announce audit for the affected prefix and check other tools writing to this speaker. The alert clears an hour after the last replacement."
      - eval_time: 64m
        alertname: PrefixdBlackholeReplaced
        exp_alerts:
          - exp_labels: {severity: critical, job: prefixd, instance: a, pop: pop-a}
            exp_annotations:
              summary: "Unleased blackhole replaced an untracked local route"
              description: "prefixd on a at POP pop-a reported an unleased blackhole add that replaced an untracked local route in the last hour. This is historical replacement evidence, not proof of an active conflict or router enforcement. Inspect the error log and announce audit for the affected prefix and check other tools writing to this speaker. The alert clears an hour after the last replacement."
      - eval_time: 65m
        alertname: PrefixdBlackholeReplaced
        exp_alerts: []
      - eval_time: 85m
        alertname: PrefixdBlackholeReplaced
        exp_alerts: []
  # A restart resets the counter to zero. The reset itself is not a
  # replacement: a counter left positive by a replacement more than an hour
  # earlier never fires, before or after the restart.
  - interval: 1m
    input_series:
      - series: 'prefixd_blackhole_replaced_total{job="prefixd",instance="a",pop="pop-a"}'
        values: '1x70 0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: PrefixdBlackholeReplaced
        exp_alerts: []
      - eval_time: 75m
        alertname: PrefixdBlackholeReplaced
        exp_alerts: []
      - eval_time: 100m
        alertname: PrefixdBlackholeReplaced
        exp_alerts: []
  # A replacement shortly before a restart stays in the window across the
  # reset, then clears with no new replacement.
  - interval: 1m
    input_series:
      - series: 'prefixd_blackhole_replaced_total{job="prefixd",instance="a",pop="pop-a"}'
        values: '0x5 1x10 0x80'
    alert_rule_test:
      - eval_time: 20m
        alertname: PrefixdBlackholeReplaced
        exp_alerts:
          - exp_labels: {severity: critical, job: prefixd, instance: a, pop: pop-a}
            exp_annotations:
              summary: "Unleased blackhole replaced an untracked local route"
              description: "prefixd on a at POP pop-a reported an unleased blackhole add that replaced an untracked local route in the last hour. This is historical replacement evidence, not proof of an active conflict or router enforcement. Inspect the error log and announce audit for the affected prefix and check other tools writing to this speaker. The alert clears an hour after the last replacement."
      - eval_time: 70m
        alertname: PrefixdBlackholeReplaced
        exp_alerts: []
      - eval_time: 95m
        alertname: PrefixdBlackholeReplaced
        exp_alerts: []
  # A series that stays at zero never fires.
  - interval: 1m
    input_series:
      - series: 'prefixd_blackhole_replaced_total{job="prefixd",instance="a",pop="pop-a"}'
        values: '0x90'
    alert_rule_test:
      - eval_time: 5m
        alertname: PrefixdBlackholeReplaced
        exp_alerts: []
      - eval_time: 90m
        alertname: PrefixdBlackholeReplaced
        exp_alerts: []
  # Without a replacement series, enabling unleased detector blackholes
  # alone must not trigger this conflict alert.
  - interval: 1m
    input_series:
      - series: 'prefixd_blackhole_detector_unleased{job="prefixd",instance="a"}'
        values: '1x3'
    alert_rule_test:
      - eval_time: 3m
        alertname: PrefixdBlackholeReplaced
        exp_alerts: []

  # Dashboard queries retain backend identity; retired peers vanish rather than
  # being displayed from their last historical UP sample.
  - interval: 1m
    input_series:
      - series: 'prefixd_bgp_session_up{backend="rustbgpd",peer="192.0.2.1"}'
        values: '1x2 stale'
      - series: 'prefixd_bgp_session_up{backend="gobgp",peer="192.0.2.2"}'
        values: '0x6'
      - series: 'prefixd_speaker_capability{backend="rustbgpd",capability="blackhole_lease"}'
        values: '0x1 1x1 0x2'
      - series: 'prefixd_speaker_capability{backend="gobgp",capability="blackhole_lease"}'
        values: '0x6'
      - series: 'prefixd_announcements_latency_seconds_bucket{backend="rustbgpd",le="1"}'
        values: '0+10x6'
      - series: 'prefixd_announcements_latency_seconds_bucket{backend="rustbgpd",le="+Inf"}'
        values: '0+10x6'
      - series: 'prefixd_announcements_latency_seconds_bucket{backend="gobgp",le="1"}'
        values: '0+20x6'
      - series: 'prefixd_announcements_latency_seconds_bucket{backend="gobgp",le="+Inf"}'
        values: '0+20x6'
    promql_expr_test:
      - expr: prefixd_bgp_session_up
        eval_time: 1m
        exp_samples:
          - labels: 'prefixd_bgp_session_up{backend="rustbgpd",peer="192.0.2.1"}'
            value: 1
          - labels: 'prefixd_bgp_session_up{backend="gobgp",peer="192.0.2.2"}'
            value: 0
      - expr: prefixd_bgp_session_up
        eval_time: 4m
        exp_samples:
          - labels: 'prefixd_bgp_session_up{backend="gobgp",peer="192.0.2.2"}'
            value: 0
      - expr: 'prefixd_speaker_capability{backend="rustbgpd",capability="blackhole_lease"}'
        eval_time: 1m
        exp_samples:
          - labels: 'prefixd_speaker_capability{backend="rustbgpd",capability="blackhole_lease"}'
            value: 0
      - expr: 'prefixd_speaker_capability{backend="rustbgpd",capability="blackhole_lease"}'
        eval_time: 3m
        exp_samples:
          - labels: 'prefixd_speaker_capability{backend="rustbgpd",capability="blackhole_lease"}'
            value: 1
      - expr: 'prefixd_speaker_capability{backend="rustbgpd",capability="blackhole_lease"}'
        eval_time: 5m
        exp_samples:
          - labels: 'prefixd_speaker_capability{backend="rustbgpd",capability="blackhole_lease"}'
            value: 0
      - expr: histogram_quantile(0.50, sum(rate(prefixd_announcements_latency_seconds_bucket[5m])) by (backend, le))
        eval_time: 5m
        exp_samples:
          - labels: '{backend="rustbgpd"}'
            value: 0.5
          - labels: '{backend="gobgp"}'
            value: 0.5

  # Leased FlowSpec survives in the last complete inventory after target loss.
  # Healthy instances in both the same and another POP cannot hide the outage;
  # another job cannot cause one. The lookback ends exactly one hour after the
  # last sample, while the generic down alert remains available.
  - interval: 15s
    input_series:
      - series: 'up{job="prefixd",instance="a"}'
        values: '1x4 0x240'
      - series: 'prefixd_leased_mitigations_active{job="prefixd",instance="a",pop="pop-a"}'
        values: '2x4 stale'
      - series: 'prefixd_injection_lease_renewal_overdue{job="prefixd",instance="a"}'
        values: '0x4 stale'
      - series: 'up{job="prefixd",instance="b"}'
        values: '1x245'
      - series: 'prefixd_leased_mitigations_active{job="prefixd",instance="b",pop="pop-b"}'
        values: '3x245'
      - series: 'prefixd_injection_lease_renewal_overdue{job="prefixd",instance="b"}'
        values: '0x245'
      - series: 'up{job="prefixd",instance="c"}'
        values: '1x245'
      - series: 'prefixd_leased_mitigations_active{job="prefixd",instance="c",pop="pop-a"}'
        values: '2x245'
      - series: 'prefixd_injection_lease_renewal_overdue{job="prefixd",instance="c"}'
        values: '0x245'
      - series: 'up{job="other",instance="d"}'
        values: '0x245'
      - series: 'prefixd_leased_mitigations_active{job="other",instance="d",pop="pop-d"}'
        values: '5x245'
    alert_rule_test:
      - eval_time: 75s
        alertname: PrefixdLeasedMitigationsAtRisk
        exp_alerts: []
      - eval_time: 90s
        alertname: PrefixdLeasedMitigationsAtRisk
        exp_alerts:
          - exp_labels: {severity: critical, job: prefixd, instance: a, pop: pop-a}
            exp_annotations:
              summary: "Leased mitigations may lapse"
              description: "prefixd on a at POP pop-a last reported 2 active leased mitigation(s), but its scrape is failing or lease renewal is overdue. The speaker removes leased routes when their lease expires. Restore the controller and check its database, lease health and speaker state. This is retained intent and renewal evidence, not proof of router enforcement."
      - eval_time: 60m
        alertname: PrefixdLeasedMitigationsAtRisk
        exp_alerts:
          - exp_labels: {severity: critical, job: prefixd, instance: a, pop: pop-a}
            exp_annotations:
              summary: "Leased mitigations may lapse"
              description: "prefixd on a at POP pop-a last reported 2 active leased mitigation(s), but its scrape is failing or lease renewal is overdue. The speaker removes leased routes when their lease expires. Restore the controller and check its database, lease health and speaker state. This is retained intent and renewal evidence, not proof of router enforcement."
      - eval_time: 61m
        alertname: PrefixdLeasedMitigationsAtRisk
        exp_alerts: []

  # Explicit zero after withdrawal prevents an older nonzero count from firing.
  # Unleased-only, no active routes, and never-observed inventory also stay quiet.
  - interval: 15s
    input_series:
      - series: 'up{job="prefixd",instance="a"}'
        values: '1x4 0x20'
      - series: 'prefixd_leased_mitigations_active{job="prefixd",instance="a",pop="pop-a"}'
        values: '2x2 0x1 stale'
      - series: 'up{job="prefixd",instance="b"}'
        values: '1x4 0x20'
      - series: 'prefixd_leased_mitigations_active{job="prefixd",instance="b",pop="pop-b"}'
        values: '0x4 stale'
      - series: 'prefixd_mitigations_active{job="prefixd",instance="b",pop="pop-b",action_type="discard"}'
        values: '5x4 stale'
      - series: 'up{job="prefixd",instance="c"}'
        values: '1x4 0x20'
      - series: 'prefixd_injection_lease_renewal_overdue{job="prefixd",instance="c"}'
        values: '1x4 stale'
    alert_rule_test:
      - eval_time: 90s
        alertname: PrefixdLeasedMitigationsAtRisk
        exp_alerts: []
      - eval_time: 5m
        alertname: PrefixdLeasedMitigationsAtRisk
        exp_alerts: []

  # The process remains reachable and its event-published state stays live, but
  # scrape-time renewal evidence is overdue. Recovery clears immediately.
  # A renewing standby and a controller with no leased intent do not fire.
  - interval: 15s
    input_series:
      - series: 'up{job="prefixd",instance="a"}'
        values: '1x20'
      - series: 'prefixd_leased_mitigations_active{job="prefixd",instance="a",pop="pop-a"}'
        values: '2x20'
      - series: 'prefixd_injection_lease_state{job="prefixd",instance="a",state="live"}'
        values: '1x20'
      - series: 'prefixd_injection_lease_renewal_overdue{job="prefixd",instance="a"}'
        values: '0x4 1x4 0x10'
      - series: 'up{job="prefixd",instance="b"}'
        values: '1x20'
      - series: 'prefixd_leased_mitigations_active{job="prefixd",instance="b",pop="pop-b"}'
        values: '0x20'
      - series: 'prefixd_injection_lease_renewal_overdue{job="prefixd",instance="b"}'
        values: '1x20'
      - series: 'up{job="prefixd",instance="c"}'
        values: '1x20'
      - series: 'prefixd_leased_mitigations_active{job="prefixd",instance="c",pop="pop-c"}'
        values: '4x20'
      - series: 'prefixd_injection_lease_renewal_overdue{job="prefixd",instance="c"}'
        values: '0x20'
      - series: 'prefixd_controller_fence_active{job="prefixd",instance="c"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 75s
        alertname: PrefixdLeasedMitigationsAtRisk
        exp_alerts: []
      - eval_time: 90s
        alertname: PrefixdLeasedMitigationsAtRisk
        exp_alerts:
          - exp_labels: {severity: critical, job: prefixd, instance: a, pop: pop-a}
            exp_annotations:
              summary: "Leased mitigations may lapse"
              description: "prefixd on a at POP pop-a last reported 2 active leased mitigation(s), but its scrape is failing or lease renewal is overdue. The speaker removes leased routes when their lease expires. Restore the controller and check its database, lease health and speaker state. This is retained intent and renewal evidence, not proof of router enforcement."
      - eval_time: 135s
        alertname: PrefixdLeasedMitigationsAtRisk
        exp_alerts:
          - exp_labels: {severity: critical, job: prefixd, instance: a, pop: pop-a}
            exp_annotations:
              summary: "Leased mitigations may lapse"
              description: "prefixd on a at POP pop-a last reported 2 active leased mitigation(s), but its scrape is failing or lease renewal is overdue. The speaker removes leased routes when their lease expires. Restore the controller and check its database, lease health and speaker state. This is retained intent and renewal evidence, not proof of router enforcement."
      - eval_time: 150s
        alertname: PrefixdLeasedMitigationsAtRisk
        exp_alerts: []

  # A short failed scrape recovers before the hold expires.
  - interval: 15s
    input_series:
      - series: 'up{job="prefixd",instance="a"}'
        values: '1x4 0 1x10'
      - series: 'prefixd_leased_mitigations_active{job="prefixd",instance="a",pop="pop-a"}'
        values: '2x4 stale 2x10'
      - series: 'prefixd_injection_lease_renewal_overdue{job="prefixd",instance="a"}'
        values: '0x4 stale 0x10'
    alert_rule_test:
      - eval_time: 75s
        alertname: PrefixdLeasedMitigationsAtRisk
        exp_alerts: []
      - eval_time: 90s
        alertname: PrefixdLeasedMitigationsAtRisk
        exp_alerts: []

  # Restarted and reachable, but no new complete inventory: retain the old
  # leased count rather than treating the absent metric as empty. A successful
  # zero inventory clears it even while renewal stays overdue.
  - interval: 15s
    input_series:
      - series: 'up{job="prefixd",instance="a"}'
        values: '1x20'
      - series: 'prefixd_leased_mitigations_active{job="prefixd",instance="a",pop="pop-a"}'
        values: '2x4 stale _x3 0x10'
      - series: 'prefixd_injection_lease_renewal_overdue{job="prefixd",instance="a"}'
        values: '0x4 1x15'
    alert_rule_test:
      - eval_time: 90s
        alertname: PrefixdLeasedMitigationsAtRisk
        exp_alerts:
          - exp_labels: {severity: critical, job: prefixd, instance: a, pop: pop-a}
            exp_annotations:
              summary: "Leased mitigations may lapse"
              description: "prefixd on a at POP pop-a last reported 2 active leased mitigation(s), but its scrape is failing or lease renewal is overdue. The speaker removes leased routes when their lease expires. Restore the controller and check its database, lease health and speaker state. This is retained intent and renewal evidence, not proof of router enforcement."
      - eval_time: 150s
        alertname: PrefixdLeasedMitigationsAtRisk
        exp_alerts: []
