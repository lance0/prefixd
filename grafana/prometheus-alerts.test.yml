rule_files:
  - prometheus-alerts.yml
evaluation_interval: 1m
tests:
  # Blackholes active, then prefixd goes down: all three relevant alerts fire.
  - interval: 1m
    input_series:
      - series: 'up{job="prefixd",instance="a"}'
        values: '1x10 0x20'
      - series: 'prefixd_controller_fence_active{job="prefixd",instance="a"}'
        values: '1x10 stale'
      - series: 'prefixd_mitigations_active{job="prefixd",instance="a",action_type="blackhole",pop="p"}'
        values: '2x10 stale'
    alert_rule_test:
      - eval_time: 20m
        alertname: PrefixdDown
        exp_alerts:
          - exp_labels: {severity: critical, job: prefixd, instance: a}
            exp_annotations:
              summary: "prefixd is down"
              description: "a has failed scrapes for 2 minutes. TTL expiry and withdrawals stop while it is down, and announced routes stay on the speaker."
      - eval_time: 20m
        alertname: PrefixdBlackholesWhileDegraded
        exp_alerts:
          - exp_labels: {severity: critical, job: prefixd}
            exp_annotations:
              summary: "Blackholes may outlive an inactive prefixd"
              description: "prefixd had active blackholes when its last active controller stopped. They stay announced until prefixd returns or an operator withdraws them on the speaker. Restart prefixd: it expires overdue blackholes, and startup reconciliation removes routes left by terminal rows. If you withdraw by hand on the speaker, also withdraw in prefixd once it returns, or reconciliation re-announces blackholes whose TTL has not passed."
      - eval_time: 20m
        alertname: PrefixdNotReady
        exp_alerts: []
  # Blackholes ended before prefixd went down: only PrefixdDown fires.
  - interval: 1m
    input_series:
      - series: 'up{job="prefixd",instance="a"}'
        values: '1x10 0x20'
      - series: 'prefixd_controller_fence_active{job="prefixd",instance="a"}'
        values: '1x10 stale'
      - series: 'prefixd_mitigations_active{job="prefixd",instance="a",action_type="blackhole",pop="p"}'
        values: '2x4 stale'
    alert_rule_test:
      - eval_time: 20m
        alertname: PrefixdBlackholesWhileDegraded
        exp_alerts: []
  # Up but in standby with blackholes: not ready and degraded.
  - interval: 1m
    input_series:
      - series: 'up{job="prefixd",instance="a"}'
        values: '1x30'
      - series: 'prefixd_controller_fence_active{job="prefixd",instance="a"}'
        values: '1x10 0x20'
      - series: 'prefixd_mitigations_active{job="prefixd",instance="a",action_type="blackhole",pop="p"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: PrefixdNotReady
        exp_alerts:
          - exp_labels: {severity: critical, job: prefixd}
            exp_annotations:
              summary: "No active prefixd controller"
              description: "Every scraped prefixd process is in standby: none holds the fence, so nothing expires, withdraws or reconciles."
      - eval_time: 20m
        alertname: PrefixdBlackholesWhileDegraded
        exp_alerts:
          - exp_labels: {severity: critical, job: prefixd}
            exp_annotations:
              summary: "Blackholes may outlive an inactive prefixd"
              description: "prefixd had active blackholes when its last active controller stopped. They stay announced until prefixd returns or an operator withdraws them on the speaker. Restart prefixd: it expires overdue blackholes, and startup reconciliation removes routes left by terminal rows. If you withdraw by hand on the speaker, also withdraw in prefixd once it returns, or reconciliation re-announces blackholes whose TTL has not passed."
      - eval_time: 20m
        alertname: PrefixdDown
        exp_alerts: []
  # prefixd goes down while the blackhole gauge reads 0: only PrefixdDown fires.
  - interval: 1m
    input_series:
      - series: 'up{job="prefixd",instance="a"}'
        values: '1x10 0x20'
      - series: 'prefixd_controller_fence_active{job="prefixd",instance="a"}'
        values: '1x10 stale'
      - series: 'prefixd_mitigations_active{job="prefixd",instance="a",action_type="blackhole",pop="p"}'
        values: '0x10 stale'
    alert_rule_test:
      - eval_time: 20m
        alertname: PrefixdBlackholesWhileDegraded
        exp_alerts: []
  # Up and active with blackholes: nothing fires.
  - interval: 1m
    input_series:
      - series: 'up{job="prefixd",instance="a"}'
        values: '1x30'
      - series: 'prefixd_controller_fence_active{job="prefixd",instance="a"}'
        values: '1x30'
      - series: 'prefixd_mitigations_active{job="prefixd",instance="a",action_type="blackhole",pop="p"}'
        values: '2x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: PrefixdBlackholesWhileDegraded
        exp_alerts: []
      - eval_time: 20m
        alertname: PrefixdDown
        exp_alerts: []
  # Blackholes exported to no peer for 5 minutes fire per reason; a brief
  # pending export or a default 120-second restart selection hold does not,
  # and a hold that outlasts the window does.
  - interval: 1m
    input_series:
      - series: 'prefixd_blackhole_unexported{job="prefixd",instance="a",reason="export_policy"}'
        values: '0x2 1x10'
      - series: 'prefixd_blackhole_unexported{job="prefixd",instance="a",reason="no_established_peer"}'
        values: '0x2 2x10'
      - series: 'prefixd_blackhole_unexported{job="prefixd",instance="a",reason="pending"}'
        values: '0x2 1x2 0x8'
      - series: 'prefixd_blackhole_unexported{job="prefixd",instance="a",reason="selection_deferred"}'
        values: '0x2 1x2 0x8'
      - series: 'prefixd_blackhole_unexported{job="prefixd",instance="b",reason="selection_deferred"}'
        values: '0x2 1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: PrefixdBlackholeNotExported
        exp_alerts: []
      - eval_time: 10m
        alertname: PrefixdBlackholeNotExported
        exp_alerts:
          - exp_labels: {severity: warning, job: prefixd, instance: a, reason: export_policy}
            exp_annotations:
              summary: "Active blackhole exported to no peer"
              description: "1 active blackhole(s) on a are committed to no Established peer, reason export_policy, so no router is sent them. Export policy denies them toward every Established peer; check the speaker's export policy. Health detail lists each blackhole under speaker.blackhole_exports."
          - exp_labels: {severity: warning, job: prefixd, instance: a, reason: no_established_peer}
            exp_annotations:
              summary: "Active blackhole exported to no peer"
              description: "2 active blackhole(s) on a are committed to no Established peer, reason no_established_peer, so no router is sent them. Health detail lists each blackhole under speaker.blackhole_exports."
          - exp_labels: {severity: warning, job: prefixd, instance: b, reason: selection_deferred}
            exp_annotations:
              summary: "Active blackhole exported to no peer"
              description: "1 active blackhole(s) on b are committed to no Established peer, reason selection_deferred, so no router is sent them. The speaker still holds them from selection after a restart; check that its Graceful Restart peers have sent End-of-RIB. Health detail lists each blackhole under speaker.blackhole_exports."

  # Startup exports the series at zero, so the first replacement fires. Only
  # the affected POP fires, and the alert clears once the last increase
  # leaves the one-hour window.
  - interval: 1m
    input_series:
      - series: 'prefixd_blackhole_replaced_total{job="prefixd",instance="a",pop="pop-a"}'
        values: '0x5 1x80'
      - series: 'prefixd_blackhole_replaced_total{job="prefixd",instance="b",pop="pop-b"}'
        values: '0x85'
    alert_rule_test:
      - eval_time: 5m
        alertname: PrefixdBlackholeReplaced
        exp_alerts: []
      - eval_time: 6m
        alertname: PrefixdBlackholeReplaced
        exp_alerts:
          - exp_labels: {severity: critical, job: prefixd, instance: a, pop: pop-a}
            exp_annotations:
              summary: "Unleased blackhole replaced an untracked local route"
              description: "prefixd on a at POP pop-a reported an unleased blackhole add that replaced an untracked local route in the last hour. This is historical replacement evidence, not proof of an active conflict or router enforcement. Inspect the error log and announce audit for the affected prefix and check other tools writing to this speaker. The alert clears an hour after the last replacement."
      - eval_time: 64m
        alertname: PrefixdBlackholeReplaced
        exp_alerts:
          - exp_labels: {severity: critical, job: prefixd, instance: a, pop: pop-a}
            exp_annotations:
              summary: "Unleased blackhole replaced an untracked local route"
              description: "prefixd on a at POP pop-a reported an unleased blackhole add that replaced an untracked local route in the last hour. This is historical replacement evidence, not proof of an active conflict or router enforcement. Inspect the error log and announce audit for the affected prefix and check other tools writing to this speaker. The alert clears an hour after the last replacement."
      - eval_time: 65m
        alertname: PrefixdBlackholeReplaced
        exp_alerts: []
      - eval_time: 85m
        alertname: PrefixdBlackholeReplaced
        exp_alerts: []
  # A restart resets the counter to zero. The reset itself is not a
  # replacement: a counter left positive by a replacement more than an hour
  # earlier never fires, before or after the restart.
  - interval: 1m
    input_series:
      - series: 'prefixd_blackhole_replaced_total{job="prefixd",instance="a",pop="pop-a"}'
        values: '1x70 0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: PrefixdBlackholeReplaced
        exp_alerts: []
      - eval_time: 75m
        alertname: PrefixdBlackholeReplaced
        exp_alerts: []
      - eval_time: 100m
        alertname: PrefixdBlackholeReplaced
        exp_alerts: []
  # A replacement shortly before a restart stays in the window across the
  # reset, then clears with no new replacement.
  - interval: 1m
    input_series:
      - series: 'prefixd_blackhole_replaced_total{job="prefixd",instance="a",pop="pop-a"}'
        values: '0x5 1x10 0x80'
    alert_rule_test:
      - eval_time: 20m
        alertname: PrefixdBlackholeReplaced
        exp_alerts:
          - exp_labels: {severity: critical, job: prefixd, instance: a, pop: pop-a}
            exp_annotations:
              summary: "Unleased blackhole replaced an untracked local route"
              description: "prefixd on a at POP pop-a reported an unleased blackhole add that replaced an untracked local route in the last hour. This is historical replacement evidence, not proof of an active conflict or router enforcement. Inspect the error log and announce audit for the affected prefix and check other tools writing to this speaker. The alert clears an hour after the last replacement."
      - eval_time: 70m
        alertname: PrefixdBlackholeReplaced
        exp_alerts: []
      - eval_time: 95m
        alertname: PrefixdBlackholeReplaced
        exp_alerts: []
  # A series that stays at zero never fires.
  - interval: 1m
    input_series:
      - series: 'prefixd_blackhole_replaced_total{job="prefixd",instance="a",pop="pop-a"}'
        values: '0x90'
    alert_rule_test:
      - eval_time: 5m
        alertname: PrefixdBlackholeReplaced
        exp_alerts: []
      - eval_time: 90m
        alertname: PrefixdBlackholeReplaced
        exp_alerts: []
  # Without a replacement series, enabling unleased detector blackholes
  # alone must not trigger this conflict alert.
  - interval: 1m
    input_series:
      - series: 'prefixd_blackhole_detector_unleased{job="prefixd",instance="a"}'
        values: '1x3'
    alert_rule_test:
      - eval_time: 3m
        alertname: PrefixdBlackholeReplaced
        exp_alerts: []

  # Dashboard queries retain backend identity; retired peers vanish rather than
  # being displayed from their last historical UP sample.
  - interval: 1m
    input_series:
      - series: 'prefixd_bgp_session_up{backend="rustbgpd",peer="192.0.2.1"}'
        values: '1x2 stale'
      - series: 'prefixd_bgp_session_up{backend="gobgp",peer="192.0.2.2"}'
        values: '0x6'
      - series: 'prefixd_speaker_capability{backend="rustbgpd",capability="blackhole_lease"}'
        values: '0x1 1x1 0x2'
      - series: 'prefixd_speaker_capability{backend="gobgp",capability="blackhole_lease"}'
        values: '0x6'
      - series: 'prefixd_announcements_latency_seconds_bucket{backend="rustbgpd",le="1"}'
        values: '0+10x6'
      - series: 'prefixd_announcements_latency_seconds_bucket{backend="rustbgpd",le="+Inf"}'
        values: '0+10x6'
      - series: 'prefixd_announcements_latency_seconds_bucket{backend="gobgp",le="1"}'
        values: '0+20x6'
      - series: 'prefixd_announcements_latency_seconds_bucket{backend="gobgp",le="+Inf"}'
        values: '0+20x6'
    promql_expr_test:
      - expr: prefixd_bgp_session_up
        eval_time: 1m
        exp_samples:
          - labels: 'prefixd_bgp_session_up{backend="rustbgpd",peer="192.0.2.1"}'
            value: 1
          - labels: 'prefixd_bgp_session_up{backend="gobgp",peer="192.0.2.2"}'
            value: 0
      - expr: prefixd_bgp_session_up
        eval_time: 4m
        exp_samples:
          - labels: 'prefixd_bgp_session_up{backend="gobgp",peer="192.0.2.2"}'
            value: 0
      - expr: 'prefixd_speaker_capability{backend="rustbgpd",capability="blackhole_lease"}'
        eval_time: 1m
        exp_samples:
          - labels: 'prefixd_speaker_capability{backend="rustbgpd",capability="blackhole_lease"}'
            value: 0
      - expr: 'prefixd_speaker_capability{backend="rustbgpd",capability="blackhole_lease"}'
        eval_time: 3m
        exp_samples:
          - labels: 'prefixd_speaker_capability{backend="rustbgpd",capability="blackhole_lease"}'
            value: 1
      - expr: 'prefixd_speaker_capability{backend="rustbgpd",capability="blackhole_lease"}'
        eval_time: 5m
        exp_samples:
          - labels: 'prefixd_speaker_capability{backend="rustbgpd",capability="blackhole_lease"}'
            value: 0
      - expr: histogram_quantile(0.50, sum(rate(prefixd_announcements_latency_seconds_bucket[5m])) by (backend, le))
        eval_time: 5m
        exp_samples:
          - labels: '{backend="rustbgpd"}'
            value: 0.5
          - labels: '{backend="gobgp"}'
            value: 0.5
