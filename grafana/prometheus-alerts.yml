# prefixd availability alerts. TTL expiry, withdrawals and reconciliation need
# a running controller that holds its POP's fence; routes already announced
# stay on the speaker while it is down. See docs/how-to/grafana.md.
groups:
  - name: prefixd-availability
    rules:
      - alert: PrefixdDown
        expr: up{job="prefixd"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "prefixd is down"
          description: >-
            {{ $labels.instance }} has failed scrapes for 2 minutes. TTL expiry
            and withdrawals stop while it is down, and announced routes stay on
            the speaker.

      - alert: PrefixdNotReady
        expr: max by (job) (prefixd_controller_fence_active) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No active prefixd controller"
          description: >-
            Every scraped prefixd process is in standby: none holds the fence,
            so nothing expires, withdraws or reconciles.

      # The blackhole count at the last moment a controller was active, once no
      # controller is up and active. The gauge counts database state, not routes.
      # The blackhole series vanishes rather than reading 0 when the last one
      # ends, so a plain `last_over_time(...) > 0` lookback would also fire for
      # blackholes that ended hours before the outage; comparing timestamps
      # does not. The 3d lookback outlasts a weekend outage.
      - alert: PrefixdBlackholesWhileDegraded
        expr: |
          (
            max by (job) (up{job="prefixd"}) == 0
            or on (job) max by (job) (prefixd_controller_fence_active) == 0
          )
          and on (job)
          (
            last_over_time((timestamp(sum by (job) (prefixd_mitigations_active{action_type="blackhole"}) > 0))[3d:5m])
            >= on (job)
            last_over_time((timestamp(max by (job) (prefixd_controller_fence_active) == 1))[3d:5m]) - 300
          )
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Blackholes may outlive an inactive prefixd"
          description: >-
            prefixd had active blackholes when its last active controller
            stopped. They stay announced until prefixd returns or an operator
            withdraws them on the speaker. Restart prefixd: it expires overdue
            blackholes, and startup reconciliation removes routes left by
            terminal rows. If you withdraw by hand on the speaker, also
            withdraw in prefixd once it returns, or reconciliation re-announces
            blackholes whose TTL has not passed.

  # Export evidence (rustbgpd only): committed means the route is in a peer's
  # Adj-RIB-Out, so this rule detects missing export and never proves
  # enforcement. See docs/reference/speaker-backends.md#export-evidence.
  - name: prefixd-blackhole-export
    rules:
      - alert: PrefixdBlackholeNotExported
        expr: prefixd_blackhole_unexported > 0
        # Outlasts rustbgpd's default 120-second restart selection deferral
        # (reason selection_deferred), so a planned speaker restart does not
        # fire it. Keep it longer than the speaker's gr_restart_time.
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Active blackhole exported to no peer"
          description: >-
            {{ $value }} active blackhole(s) on {{ $labels.instance }} are
            committed to no Established peer, reason {{ $labels.reason }}, so
            no router is sent them.{{ if eq $labels.reason "export_policy" }}
            Export policy denies them toward every Established peer; check
            the speaker's export policy.{{ end }}{{ if eq $labels.reason "selection_deferred" }}
            The speaker still holds them from selection after a restart;
            check that its Graceful Restart peers have sent End-of-RIB.{{ end }} Health
            detail lists each blackhole under speaker.blackhole_exports.

  # Local-replacement evidence from the last hour. Startup exports the
  # configured POP's series at zero, so increase() sees the first replacement.
  - name: prefixd-blackhole-conflicts
    rules:
      - alert: PrefixdBlackholeReplaced
        expr: increase(prefixd_blackhole_replaced_total[1h]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Unleased blackhole replaced an untracked local route"
          description: >-
            prefixd on {{ $labels.instance }} at POP {{ $labels.pop }} reported
            an unleased blackhole add that replaced an untracked local route
            in the last hour. This is historical replacement evidence, not
            proof of an active conflict or router enforcement. Inspect the
            error log and announce audit for the affected prefix and check
            other tools writing to this speaker. The alert clears an hour
            after the last replacement.
