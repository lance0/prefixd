# Copied from rustbgpd's .github/actions/install-containerlab. The only change
# is that the pinned SHA-256 is an input here instead of a lookup in rustbgpd's
# pinned-archives manifest; bump both inputs together.
name: "Install containerlab (hardened)"
description: >-
  Install a pinned containerlab release. The .deb is restored from its
  content-addressed cache entry and checked against its pinned SHA-256; on a
  miss or a bad cache hit it is fetched upstream with retry + backoff and
  checked again before it is installed or saved. A truncated download or an
  HTML error body fails the checksum like any other wrong bytes.
inputs:
  version:
    description: "containerlab release version (without leading v)."
    required: false
    default: "0.74.3"
  sha256:
    description: "SHA-256 of containerlab_<version>_linux_amd64.deb."
    required: false
    default: "e9f7fec82daae07b13dc61c25a877a2d81574809fefd6b11cd4ec0b0f4a36474"
runs:
  using: "composite"
  steps:
    # The key includes the version and digest, so a bump of either input
    # misses the cache and re-downloads.
    - name: Restore exact containerlab .deb cache
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/containerlab-cache/containerlab_${{ inputs.version }}_linux_amd64.deb
        key: containerlab-deb-v${{ inputs.version }}-linux-amd64-${{ inputs.sha256 }}

    - name: Verify cached containerlab .deb or fetch it upstream
      shell: bash
      env:
        CLAB_VERSION: ${{ inputs.version }}
        CLAB_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        url="https://github.com/srl-labs/containerlab/releases/download/v${CLAB_VERSION}/containerlab_${CLAB_VERSION}_linux_amd64.deb"
        deb="$RUNNER_TEMP/containerlab-cache/containerlab_${CLAB_VERSION}_linux_amd64.deb"
        mkdir -p "$(dirname "$deb")"
        verify() { echo "${CLAB_SHA256}  ${deb}" | sha256sum --check --status; }
        if [ -f "$deb" ] && verify; then
          echo "using verified cached containerlab .deb (sha256 ${CLAB_SHA256})"
          exit 0
        fi
        if [ -f "$deb" ]; then
          echo "::warning::discarding cached containerlab .deb that fails its pinned SHA-256"
        fi
        # The outer loop owns retry + backoff: a 200-OK truncated or HTML body
        # is a curl success that only the checksum catches.
        attempts=4
        for attempt in $(seq 1 "$attempts"); do
          rm -f "$deb"
          if curl -fsSL --connect-timeout 15 --max-time 90 "$url" -o "$deb" && verify; then
            echo "downloaded and verified containerlab .deb (sha256 ${CLAB_SHA256})"
            exit 0
          fi
          echo "::warning::containerlab download/verify attempt ${attempt}/${attempts} failed: $(file -b "$deb" 2>/dev/null | head -c 80)"
          sleep $((attempt * 5))
        done
        rm -f "$deb"
        echo "::error::containerlab .deb download/verification failed after ${attempts} attempts: ${url}"
        exit 1

    - name: Save verified containerlab .deb cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/containerlab-cache/containerlab_${{ inputs.version }}_linux_amd64.deb
        key: containerlab-deb-v${{ inputs.version }}-linux-amd64-${{ inputs.sha256 }}

    - name: Install containerlab ${{ inputs.version }}
      shell: bash
      env:
        CLAB_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        sudo dpkg -i "$RUNNER_TEMP/containerlab-cache/containerlab_${CLAB_VERSION}_linux_amd64.deb"
        containerlab version
