name: CI

on:
  # Version tags publish once, through release.yml.
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same branch/PR are pointless once a newer commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1"

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test GoBGP fallback
        run: just test-gobgp

      - name: Test all backend features
        run: just test-all

  msrv:
    name: MSRV (1.89.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_AUTO_INSTALL: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1"
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@1.89.0
      - name: Record compiler versions
        run: |
          rustc +1.89.0 --version --verbose
          cargo +1.89.0 --version
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-1.89.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-1.89.0-
      - name: Check minimum-compiler feature matrix
        run: just msrv

  gobgp:
    name: GoBGP (4.10.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-gobgp-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Pinned readable contract, real peers, restart and API integration
        run: scripts/test-gobgp.sh
      - name: Retain GoBGP qualification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gobgp-qualification-attempt-${{ github.run_attempt }}
          path: target/qualification/gobgp.log

  rustbgpd:
    name: rustbgpd (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ["0.79.0"]
    env:
      PREFIXD_RUSTBGPD_TEST_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rustbgpd-${{ matrix.version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Released shared controller contract, TTL and restart recovery
        run: |
          set -o pipefail
          scripts/test-rustbgpd.sh 2>&1 | tee rustbgpd-qualification.log
      - name: Retain rustbgpd qualification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rustbgpd-qualification-${{ matrix.version }}-attempt-${{ github.run_attempt }}
          path: rustbgpd-qualification.log

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1"

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: Check formatting
        run: just fmt

      - name: Check pinned rustbgpd proto
        run: just proto

      # setup-uv publishes no floating major tag, so pin its exact release.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false

      - name: Lint and format-check Python
        run: just python

      - name: Lint GoBGP fallback
        run: just clippy-gobgp

      - name: Lint all backend features
        run: just clippy-all

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1"

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release binary
        run: just build

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: prefixd-linux-amd64
          path: target/release/prefixd

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1"

      - name: Install test runtime
        uses: actions/setup-node@v7
        with:
          node-version: "26.12.0"

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Frozen install, lint, native types, tests and production build
        run: just frontend

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1"

      - name: Audit Rust dependencies
        uses: actions-rust-lang/audit@v1
        with:
          # Only advisories with no fixed release upstream. Everything else is
          # resolved by bumping the dependency in Cargo.lock -- or by dropping
          # our own use of it (rustls-pemfile was replaced by rustls-pki-types).
          # RUSTSEC-2023-0071: rsa crate - in Cargo.lock as an optional dependency
          #   of sqlx's mysql driver, which is never compiled (postgres only).
          ignore: RUSTSEC-2023-0071
          denyWarnings: false
          createIssues: false

      - name: Check Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace --all-features --locked
          command: check advisories bans licenses sources

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Audit frontend dependencies
        working-directory: frontend
        # Fix advisories in the committed resolution. Any exception needs an
        # unfixed upstream advisory and an explicit reason in the shared recipe.
        run: just audit-frontend

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [test, msrv, lint, frontend, security, gobgp, rustbgpd]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: prefixd
            context: .
            file: ./Dockerfile
          - image: prefixd-dashboard
            context: ./frontend
            file: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build images (publish on push only)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          # Cache export failures must not fail an otherwise successful image push.
          cache-to: type=gha,scope=${{ matrix.image }},mode=max,ignore-error=true
