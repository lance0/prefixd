name: CI

on:
  # Version tags publish once, through release.yml.
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same branch/PR are pointless once a newer commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test documentation classifier
        run: python3 scripts/ci-docs-scope.py --self-test
      - name: Classify pull request and check documentation patch
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          if [ "$EVENT_NAME" = pull_request ]; then
            docs_only=$(python3 scripts/ci-docs-scope.py "$BASE_SHA" "$HEAD_SHA")
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          if [ "$docs_only" = true ]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          fi

  test:
    name: Test
    needs: scope
    if: ${{ always() && !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Refuse failed scope check
        if: needs.scope.result != 'success'
        run: exit 1
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1"

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test GoBGP fallback
        run: just test-gobgp

      - name: Test all backend features
        run: just test-all

  msrv:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    name: MSRV (1.89.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_AUTO_INSTALL: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1"
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@1.89.0
      - name: Record compiler versions
        run: |
          rustc +1.89.0 --version --verbose
          cargo +1.89.0 --version
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-1.89.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-1.89.0-
      - name: Check minimum-compiler feature matrix
        run: just msrv

  gobgp:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    name: GoBGP (4.10.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-gobgp-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Pinned readable contract, real peers, restart and API integration
        run: scripts/test-gobgp.sh
      - name: Retain GoBGP qualification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gobgp-qualification-attempt-${{ github.run_attempt }}
          path: target/qualification/gobgp.log

  rustbgpd:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    name: rustbgpd (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ["0.80.0", "0.80.1"]
    env:
      PREFIXD_RUSTBGPD_TEST_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rustbgpd-${{ matrix.version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Released shared controller contract, TTL and restart recovery
        run: |
          set -o pipefail
          scripts/test-rustbgpd.sh 2>&1 | tee rustbgpd-qualification.log
      - name: Retain rustbgpd qualification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rustbgpd-qualification-${{ matrix.version }}-attempt-${{ github.run_attempt }}
          path: rustbgpd-qualification.log

  lint:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1"

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: Check formatting
        run: just fmt

      - name: Check pinned rustbgpd proto
        run: just proto

      # setup-uv publishes no floating major tag, so pin its exact release.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: false

      - name: Lint and format-check Python
        run: just python

      - name: Lint GoBGP fallback
        run: just clippy-gobgp

      - name: Lint all backend features
        run: just clippy-all

  alerts:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    name: Alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1"

      - name: Check and test Prometheus alert rules
        run: just alerts

  build:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1"

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release binary
        run: just build

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: prefixd-linux-amd64
          path: |
            target/release/prefixd
            target/release/prefixdctl

  frontend:
    needs: [scope, build]
    if: needs.scope.outputs.docs_only != 'true'
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1"

      - name: Install test runtime
        uses: actions/setup-node@v7
        with:
          node-version: "26.12.0"

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Frozen install, lint, native types, tests and production build
        run: just frontend

      - name: Download candidate controller binaries
        uses: actions/download-artifact@v8
        with:
          name: prefixd-linux-amd64
          path: target/release

      - name: Install Chrome for the existing browser smoke
        run: bunx playwright install --with-deps chrome

      - name: Authenticated browser withdrawal against an owned stack
        working-directory: .
        run: |
          chmod +x target/release/prefixd target/release/prefixdctl
          python3 scripts/test-browser.py --self-test
          python3 scripts/test-browser.py

      - name: Retain browser lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-lifecycle-attempt-${{ github.run_attempt }}
          path: target/qualification/browser-smoke
          if-no-files-found: ignore
          retention-days: 7

  security:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1"

      - name: Audit Rust dependencies
        uses: actions-rust-lang/audit@v1
        with:
          # Only advisories with no fixed release upstream. Everything else is
          # resolved by bumping the dependency in Cargo.lock -- or by dropping
          # our own use of it (rustls-pemfile was replaced by rustls-pki-types).
          # RUSTSEC-2023-0071: rsa crate - in Cargo.lock as an optional dependency
          #   of sqlx's mysql driver, which is never compiled (postgres only).
          ignore: RUSTSEC-2023-0071
          denyWarnings: false
          createIssues: false

      - name: Audit fuzz dependencies
        uses: actions-rust-lang/audit@v1
        with:
          file: fuzz/Cargo.lock
          # Same optional, uncompiled SQLx MySQL dependency as the root lockfile.
          ignore: RUSTSEC-2023-0071
          denyWarnings: false
          createIssues: false

      - name: Check Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace --all-features --locked
          command: check advisories bans licenses sources

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Audit frontend dependencies
        working-directory: frontend
        # Fix advisories in the committed resolution. Any exception needs an
        # unfixed upstream advisory and an explicit reason in the shared recipe.
        run: just audit-frontend

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [scope, test, msrv, lint, frontend, security, gobgp, rustbgpd]
    if: needs.scope.outputs.docs_only != 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: prefixd
            context: .
            file: ./Dockerfile
          - image: prefixd-dashboard
            context: ./frontend
            file: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build images (publish dashboard on push only)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' && matrix.image != 'prefixd' }}
          load: ${{ matrix.image == 'prefixd' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          # Cache export failures must not fail an otherwise successful build.
          cache-to: type=gha,scope=${{ matrix.image }},mode=max,ignore-error=true

      - name: Check Compose profiles, inventory mounts and configuration persistence
        if: matrix.image == 'prefixd'
        env:
          PREFIXD_IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: python3 scripts/test-compose.py

      # Reuse the local BuildKit cache, publishing only after the checks succeed.
      - name: Publish controller after Compose checks
        if: github.event_name == 'push' && matrix.image == 'prefixd'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
