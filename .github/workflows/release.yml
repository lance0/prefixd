name: Release

# A release publishes once, fail-closed. Three triggers resolve the same tag and
# commit in `verify`, and every later job builds that commit:
#
# - workflow_run: ci.yml passed on a main push. If that commit is the one that
#   set Cargo.toml to an untagged X.Y.Z with a dated CHANGELOG section, this
#   run tags it vX.Y.Z and publishes. Any other main commit is a quiet no-op.
#   A tag pushed with GITHUB_TOKEN starts no workflow, so this same run builds
#   and publishes the release.
# - push of a vX.Y.Z tag: a manually tagged commit publishes the same way.
# - workflow_dispatch: a dry run at the chosen ref. The tag name comes from
#   Cargo.toml, images are built and smoke-tested but never pushed, and no tag
#   or release is created.
#
# Before anything is tagged or pushed, scripts/release-check.sh requires the
# tag to equal the Cargo.toml version, the commit to be on main, and ci.yml's
# push run to have passed on that exact commit. github-actions[bot] publishes
# the GitHub Release with the CHANGELOG section as its body; an existing
# release is never overwritten. See docs/project/release-checklist.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One release per commit. Only the commit that sets a version can auto-tag it,
# and an existing tag ends the auto path, so this is also one run per version.
concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag, main CI and notes
    # workflow_run: only a successful main push run of ci.yml in this repository.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # read ci.yml runs for the release commit
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      publish: ${{ steps.check.outputs.publish }}
      create: ${{ steps.check.outputs.create }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
      previous: ${{ steps.info.outputs.previous }}
      latest: ${{ steps.info.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run would otherwise check out the default branch head.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag, check main ancestry and exact-commit CI
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          set -euo pipefail
          cargo_version() {
            git show "$1:Cargo.toml" |
              python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["package"]["version"])'
          }
          sha="$(git rev-parse HEAD)"
          version="$(cargo_version "$sha")"
          publish=true
          create=false
          case "$GITHUB_EVENT_NAME" in
          push)
            tag="$GITHUB_REF_NAME"
            ;;
          workflow_dispatch)
            tag="v$version"
            publish=false
            ;;
          workflow_run)
            tag="v$version"
            create=true
            skip=""
            if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
              skip="$tag already exists"
            elif git rev-parse --verify --quiet "$sha^" >/dev/null &&
              [ "$(cargo_version "$sha^")" = "$version" ]; then
              skip="$sha did not change the Cargo.toml version"
            elif ! git show "$sha:CHANGELOG.md" >"$RUNNER_TEMP/CHANGELOG.md" ||
              ! scripts/release-notes.py "$version" "$RUNNER_TEMP/CHANGELOG.md" >/dev/null 2>&1; then
              skip="CHANGELOG.md has no dated, nonempty ## [$version] section"
              echo "::warning::not tagging $tag: $skip"
            fi
            if [ -n "$skip" ]; then
              echo "No release: $skip."
              echo "proceed=false" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            ;;
          *)
            echo "::error::unexpected event $GITHUB_EVENT_NAME"
            exit 1
            ;;
          esac
          scripts/release-check.sh "$tag" "$sha"
          if [ "$publish" = true ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::a GitHub Release for $tag already exists; fix forward with a new version"
            exit 1
          fi
          {
            echo "proceed=true"
            echo "publish=$publish"
            echo "create=$create"
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "sha=$sha"
          } >>"$GITHUB_OUTPUT"
          echo "Release $tag at $sha (publish=$publish, create tag=$create)"

      - name: Previous release and latest marker
        id: info
        if: steps.check.outputs.proceed == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          set -euo pipefail
          scripts/release-notes.py --tag-info "$TAG" | tee -a "$GITHUB_OUTPUT"

      - name: Extract CHANGELOG section
        if: steps.check.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          scripts/release-notes.py --selftest
          scripts/release-notes.py "$VERSION" > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.proceed == 'true'
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  binaries:
    name: Linux binaries and SBOM
    needs: verify
    if: needs.verify.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Debian 12 (glibc 2.36), same toolchain as the Dockerfile builder. Building
    # on the runner would link its newer glibc.
    container: rust:1.99.1-bookworm@sha256:e12566d5abc17a0da741628782cdb504b68b8961f5bfcf677936bf3e8b32de29
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - name: Install protobuf compiler
        run: apt-get update && apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - name: Build release binaries
        run: cargo build --locked --release --bins

      - name: Generate SBOM
        run: |
          cargo install --locked cargo-cyclonedx --version 0.5.9
          cargo cyclonedx --format json --override-filename prefixd-sbom.cdx

      - name: Package, smoke-test and checksum
        run: |
          set -euo pipefail
          mkdir -p staging dist
          cp target/release/prefixd target/release/prefixdctl LICENSE staging/
          test "$(staging/prefixdctl --version)" = "prefixdctl $VERSION"
          test "$(staging/prefixd --version)" = "prefixd $VERSION"
          # Version-less name, so releases/latest/download/ URLs stay stable.
          tar -C staging -czf dist/prefixd-linux-amd64.tar.gz prefixd prefixdctl LICENSE
          cp prefixd-sbom.cdx.json dist/
          cd dist
          sha256sum prefixd-linux-amd64.tar.gz prefixd-sbom.cdx.json > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/
          if-no-files-found: error

  tag:
    name: Tag release commit
    # Runs after the checks and the binary build pass and before any image is
    # pushed. Only the workflow_run path creates a tag; the others pass through.
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the annotated tag
    steps:
      - name: Create annotated tag
        if: needs.verify.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          object="$(gh api "repos/$GH_REPO/git/tags" -f tag="$TAG" -f message="$TAG" \
            -f object="$SHA" -f type=commit \
            -f 'tagger[name]=github-actions[bot]' \
            -f 'tagger[email]=41898282+github-actions[bot]@users.noreply.github.com' --jq .sha)"
          # Fails if the tag already exists, so two runs can't both tag a version.
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" --silent
          echo "Tagged $SHA as $TAG"

  images:
    name: Image (${{ matrix.image }})
    # Push no image unless the checks, binary build and tag passed.
    needs: [verify, binaries, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: prefixd
            context: .
            file: ./Dockerfile
          - image: prefixd-dashboard
            context: ./frontend
            file: ./frontend/Dockerfile
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SHA: ${{ needs.verify.outputs.sha }}
      REPOSITORY: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REPOSITORY }}
          # X.Y.Z and X.Y (prereleases get X.Y.Z only). `latest` stays with
          # ci.yml's main-branch images.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify.outputs.tag }}
          # The default revision is github.sha, which is the default branch
          # head on workflow_run; record the release commit instead.
          labels: org.opencontainers.image.revision=${{ needs.verify.outputs.sha }}

      - name: Build image for verification
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          tags: ${{ matrix.image }}:verify
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Smoke-test image
        run: scripts/release-smoke-image.sh "${{ matrix.image }}" "${{ matrix.image }}:verify" "$VERSION" "$SHA"

      - name: Log in to GitHub Container Registry
        if: needs.verify.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push version tags
        if: needs.verify.outputs.publish == 'true'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Record digest
        if: needs.verify.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p digests
          echo "$REPOSITORY $DIGEST" > "digests/${{ matrix.image }}"

      - name: Upload digest
        if: needs.verify.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}
          path: digests/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [verify, binaries, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      PREVIOUS: ${{ needs.verify.outputs.previous }}
      LATEST: ${{ needs.verify.outputs.latest }}
      PUBLISH: ${{ needs.verify.outputs.publish }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist

      - uses: actions/download-artifact@v8
        if: needs.verify.outputs.publish == 'true'
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Assemble release body
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = true ]; then
            cat digests/* | sort > dist/image-digests.txt
            test "$(wc -l < dist/image-digests.txt)" -eq 2
          fi
          version="${TAG#v}"
          image_tags="\`$version\`"
          [[ "$version" == *-* ]] || image_tags="$image_tags and \`${version%.*}\`"
          {
            cat release-notes.md
            echo
            echo "## Artifacts"
            echo
            echo "Container images, tagged $image_tags:"
            echo
            if [ -s dist/image-digests.txt ]; then
              while read -r repo digest; do echo "- \`$repo@$digest\`"; done < dist/image-digests.txt
            else
              echo "- dry run: no images pushed"
            fi
            echo
            echo "SHA256SUMS:"
            echo
            echo '```text'
            cat dist/SHA256SUMS
            echo '```'
            if [ -n "$PREVIOUS" ]; then
              echo
              echo "**Full changelog:** $GITHUB_SERVER_URL/$GH_REPO/compare/$PREVIOUS...$TAG"
            fi
          } > release-body.md
          cat release-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        if: needs.verify.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$TAG" == *-* ]]; then
            flags=(--prerelease --latest=false)
          elif [ "$LATEST" = true ]; then
            flags=(--latest)
          else
            flags=(--latest=false) # a backported patch leaves releases/latest alone
          fi
          # Fails if a release for this tag already exists; nothing is overwritten.
          gh release create "$TAG" --verify-tag "${flags[@]}" \
            --title "$TAG" --notes-file release-body.md dist/*

  install-contract:
    name: Install contract
    needs: [verify, release]
    if: needs.verify.outputs.publish == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/release-install-contract.yml
    with:
      tag: ${{ needs.verify.outputs.tag }}
