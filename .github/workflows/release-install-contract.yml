name: Release install contract

# Check a published release's artifacts install and start: SHA256SUMS verifies
# the assets, the tarball binaries run, and both images resolve to the digests
# recorded in the release and pass the same smoke test as the release build.
# The Release workflow calls this after it publishes, whether a tag push or the
# automatic tag after main CI started it. Dispatch it by hand for any published
# release tag, for example after rerunning a Release job.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to verify (vX.Y.Z)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  contract:
    name: Verify published release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # published releases and their assets
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: scripts/release-install-contract.sh "$TAG"
