name: Release install contract

# Check a release's published artifacts install and start: SHA256SUMS verifies
# the assets, the tarball binaries run, and both images resolve to the digests
# recorded in the release and pass the same smoke test as the release build.
# Runs after a tag-triggered Release succeeds (the release is still a draft),
# or on demand for any release tag.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  contract:
    name: Verify published release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Draft releases are visible only to tokens with write access. This job
      # reads assets and writes nothing.
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # For a tag push, the triggering run's head branch is the tag name.
          TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
        run: scripts/release-install-contract.sh "$TAG"
