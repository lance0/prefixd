name: Interop

# FlowSpec, blackhole and amplification interop against a real receiving router.
# Each leg drives prefixd's HTTP API with the speaker in containerlab, peered
# to FRR 10.7.1. FlowSpec scenarios inspect received IPv4/IPv6 rules; blackhole
# also checks zebra and kernel discard state, controller restart and RPKI.
# Every run uploads a dated receipt (versions, commands, FRR JSON before and after).
#
# Job layout, the install-containerlab action and the FRR lab follow rustbgpd's
# Interop workflow and its M22 FlowSpec lab. Path filters keep documentation
# changes from paying for the labs; the nightly run catches image drift.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "proto/**"
      - "migrations/**"
      - "configs/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "docker-compose.yml"
      - "lab/**"
      - "!lab/**/*.md"
      - ".github/workflows/interop.yml"
      - ".github/actions/install-containerlab/**"
  pull_request:
    paths:
      - "src/**"
      - "proto/**"
      - "migrations/**"
      - "configs/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "docker-compose.yml"
      - "lab/**"
      - "!lab/**/*.md"
      - ".github/workflows/interop.yml"
      - ".github/actions/install-containerlab/**"
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

# Only a newer PR commit supersedes a run; nightly and main pushes never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frr:
    name: FRR (${{ matrix.speaker }}/${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - speaker: rustbgpd
            scenario: flowspec
          - speaker: gobgp
            scenario: flowspec
          - speaker: rustbgpd
            scenario: blackhole
          - speaker: rustbgpd
            scenario: amplification
          - speaker: gobgp
            scenario: amplification
    steps:
      - uses: actions/checkout@v7

      - name: Install containerlab
        uses: ./.github/actions/install-containerlab

      - name: Check FRR oracle negative controls
        run: python3 -m unittest discover -s lab/interop -p 'test_*.py'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Reuses the Docker job's layer cache for this commit's controller image.
      - name: Build prefixd:interop from this commit
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: prefixd:interop
          build-args: CARGO_BUILD_JOBS=4
          cache-from: |
            type=gha,scope=prefixd
            type=gha,scope=prefixd-interop
          cache-to: type=gha,scope=prefixd-interop,mode=max,ignore-error=true

      - name: Run FRR lab (${{ matrix.speaker }}/${{ matrix.scenario }})
        env:
          CLAB: sudo containerlab
          PREFIXD_INTEROP_RECEIPTS: ${{ runner.temp }}/interop-receipts
        run: lab/interop/run-frr.sh "${{ matrix.speaker }}" "${{ matrix.scenario }}"

      - name: Retain dated receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.scenario }}-frr-${{ matrix.speaker }}-receipt-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/interop-receipts
          if-no-files-found: warn
