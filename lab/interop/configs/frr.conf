! FlowSpec receiver for the prefixd interop lab, adapted from rustbgpd's M22
! FRR config. The speaker (rustbgpd or GoBGP, AS 65010) is 10.0.0.1; it
! negotiates IPv4 and IPv6 FlowSpec only. FRR stores received rules in its BGP
! table; it does not program a dataplane here.
frr defaults traditional
hostname frr
log stdout informational
service integrated-vtysh-config
!
router bgp 65002
 bgp router-id 10.0.0.2
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 10.0.0.1 remote-as 65010
 neighbor 10.0.0.1 description prefixd-speaker
 neighbor 10.0.0.1 timers 10 30
 neighbor 10.0.0.1 timers connect 5
 !
 address-family ipv4 flowspec
  neighbor 10.0.0.1 activate
 exit-address-family
 !
 address-family ipv6 flowspec
  neighbor 10.0.0.1 activate
 exit-address-family
!
