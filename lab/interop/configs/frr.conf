! FlowSpec and RTBH receiver for the prefixd interop lab, adapted from
! rustbgpd's M22 FRR config. The speaker (rustbgpd or GoBGP, AS 65010) is
! 10.0.0.1. Both negotiate IPv4 and IPv6 FlowSpec, which FRR only stores in its
! BGP table. rustbgpd also negotiates IPv4 and IPv6 unicast for prefixd's
! blackhole host routes: the import route-maps accept only routes carrying
! BLACKHOLE (65535:666) and rewrite their next hop to a local discard address,
! so zebra installs them as blackhole routes. Anything else is denied.
frr defaults traditional
hostname frr
log stdout informational
service integrated-vtysh-config
!
ip route 192.0.2.1/32 blackhole
ipv6 route 2001:db8:ffff::1/128 blackhole
!
bgp community-list standard RTBH seq 5 permit 65535:666
!
route-map RTBH-IN-V4 permit 10
 match community RTBH
 set ip next-hop 192.0.2.1
exit
!
route-map RTBH-IN-V4 deny 20
exit
!
route-map RTBH-IN-V6 permit 10
 match community RTBH
 set ipv6 next-hop global 2001:db8:ffff::1
exit
!
route-map RTBH-IN-V6 deny 20
exit
!
router bgp 65002
 bgp router-id 10.0.0.2
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 10.0.0.1 remote-as 65010
 neighbor 10.0.0.1 description prefixd-speaker
 neighbor 10.0.0.1 timers 10 30
 neighbor 10.0.0.1 timers connect 5
 ! The rewritten discard next hop is not on the shared link.
 neighbor 10.0.0.1 disable-connected-check
 !
 address-family ipv4 flowspec
  neighbor 10.0.0.1 activate
 exit-address-family
 !
 address-family ipv6 flowspec
  neighbor 10.0.0.1 activate
 exit-address-family
 !
 address-family ipv4 unicast
  neighbor 10.0.0.1 activate
  neighbor 10.0.0.1 soft-reconfiguration inbound
  neighbor 10.0.0.1 route-map RTBH-IN-V4 in
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 10.0.0.1 activate
  neighbor 10.0.0.1 soft-reconfiguration inbound
  neighbor 10.0.0.1 route-map RTBH-IN-V6 in
 exit-address-family
!
