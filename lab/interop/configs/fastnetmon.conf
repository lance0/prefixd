# FastNetMon Community for the interop lane: NetFlow v5 on 2055, the lab
# customer's prefixes, a low packet-rate threshold and prefixd's bundled notify
# script. FastNetMon's own BGP actions (ExaBGP, GoBGP) stay off: prefixd is the
# only writer to the speaker. Unlisted keys keep FastNetMon's defaults.
logging_level = info
logging_local_syslog_logging = off
logging_remote_syslog_logging = off
disable_usage_report = on

enable_ban = on
enable_ban_ipv6 = on
process_incoming_traffic = on
process_outgoing_traffic = off
ban_details_records_count = 20
# Above every lane step, so FastNetMon never unbans on its own; the lane
# unbans through fastnetmon_api_client or the script.
ban_time = 1900
unban_only_if_attack_finished = on

networks_list_path = /etc/networks_list
monitor_local_ip_addresses = off

check_period = 1
enable_connection_tracking = on
ban_for_pps = on
ban_for_bandwidth = off
ban_for_flows = off
threshold_pps = 1000
average_calculation_time = 5

netflow = on
netflow_port = 2055
netflow_host = 0.0.0.0
netflow_sampling_ratio = 1
sflow = off
pcap = off
mirror_afpacket = off
mirror_afxdp = off
mirror_netmap = off

notify_script_path = /usr/local/bin/prefixd-fastnetmon.sh

exabgp = off
gobgp = off
redis_enabled = off
mongodb_enabled = off
influxdb = off
clickhouse_metrics = off
graphite = off
prometheus = off

enable_api = on
pid_path = /var/run/fastnetmon.pid
cli_stats_file_path = /tmp/fastnetmon.dat
cli_stats_ipv6_file_path = /tmp/fastnetmon_ipv6.dat
